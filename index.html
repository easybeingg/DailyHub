<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08);
  --track:rgba(120,120,128,.18);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.16);
  --accent:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --gray:#8e8e93;
  --green-t:rgba(52,199,89,.16); --red-t:rgba(255,59,48,.14); --orange-t:rgba(255,149,0,.18);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --sheet:#f2f2f7; --row:#fff; --bar:rgba(249,249,249,.88); --segon:#fff; --tintp:16%;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16);
    --track:rgba(120,120,128,.32);
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
    --accent:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --gray:#8e8e93;
    --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.22);
    --shadow:none; --sheet:#1c1c1e; --row:#2c2c2e; --bar:rgba(22,22,22,.88); --segon:#636366; --tintp:28%;
  }
}
:root[data-theme="dark"]{
    --bg:#000; --card:#1c1c1e; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16);
    --track:rgba(120,120,128,.32);
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
    --accent:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --gray:#8e8e93;
    --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.22);
    --shadow:none; --sheet:#1c1c1e; --row:#2c2c2e; --bar:rgba(22,22,22,.88); --segon:#636366; --tintp:28%;
    color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
/* black & white: everything in grey tones, less visual stimulation */
:root{--onc:#fff}
html.bw{--accent:#1c1c1e;--green:#1c1c1e;--red:#6e6e73;--orange:#8a8a8f;--gray:#aeaeb2;--green-t:rgba(0,0,0,.14);--red-t:rgba(0,0,0,.08);--orange-t:rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){html.bw:not([data-theme="light"]){--accent:#f2f2f7;--green:#f2f2f7;--red:#aeaeb2;--orange:#8e8e93;--gray:#6e6e73;--green-t:rgba(255,255,255,.22);--red-t:rgba(255,255,255,.12);--orange-t:rgba(255,255,255,.07);--onc:#000}}
html.bw[data-theme="dark"]{--accent:#f2f2f7;--green:#f2f2f7;--red:#aeaeb2;--orange:#8e8e93;--gray:#6e6e73;--green-t:rgba(255,255,255,.22);--red-t:rgba(255,255,255,.12);--orange-t:rgba(255,255,255,.07);--onc:#000}
.bw .pg,.bw .tabbar,.bw .sheet,.bw .dlg,.bw .toast{filter:grayscale(1)}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill);flex:none;transition:background .2s;margin-left:auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--label);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;line-height:1.3}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-align:inherit}
button:disabled{cursor:default}
svg{display:block}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--label2);margin:0 2px 4px}
.big{font-size:32px;font-weight:700;letter-spacing:-.025em;margin:0 2px 16px;line-height:1.15}

/* Tab bar */
:root{--glass:rgba(255,255,255,.7);--glassb:rgba(0,0,0,.07);--tabon:rgba(120,120,128,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(44,44,46,.66);--glassb:rgba(255,255,255,.1);--tabon:rgba(120,120,128,.32)}}
:root[data-theme="dark"]{--glass:rgba(44,44,46,.66);--glassb:rgba(255,255,255,.1);--tabon:rgba(120,120,128,.32)}
/* floating tab bar: content scrolls behind it; shrinks while scrolling down */
.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);
  width:min(340px,calc(100% - 40px));height:64px;padding:5px;border-radius:32px;background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  box-shadow:0 10px 30px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08),inset 0 0 0 .5px var(--glassb);
  transition:width .35s cubic-bezier(.3,.8,.2,1),height .35s cubic-bezier(.3,.8,.2,1)}
.tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;height:100%}
.tab{height:100%;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--label2);text-align:center;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px;flex:none;transition:width .3s,height .3s}
.tab .tl2{max-height:14px;overflow:hidden;transition:max-height .3s,opacity .2s}
.tab.on{color:var(--accent);background:var(--tabon)}
.tabbar.mini{width:min(200px,calc(100% - 40px));height:50px}
.tabbar.mini .tab .tl2{max-height:0;opacity:0}
.tabbar.mini .tab svg{width:22px;height:22px}

/* Cards + calendar */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.cal{padding:14px 12px 6px}
.cal-top{display:flex;align-items:center;gap:8px;padding:0 4px 12px}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:17px;background:var(--fill);font-size:15px;font-weight:600;max-width:100%;min-width:0}
.pill .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill svg{width:16px;height:16px;flex:none}
.pill .chev svg{width:14px;height:14px;opacity:.5}
.pdot{width:10px;height:10px;border-radius:50%;flex:none}
.pill-x{width:34px;height:34px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label2);flex:none}
.pill-x svg{width:15px;height:15px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.mtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;padding:4px 0}
.mtitle span{color:var(--accent)}
.mtitle svg{width:16px;height:16px;color:var(--accent);stroke-width:3}
.navbtns{display:flex;align-items:center;gap:4px}
.nbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.nbtn:active{background:var(--fill)}
.nbtn svg{width:22px;height:22px}
.tbtn{height:30px;padding:0 12px;border-radius:15px;background:var(--fill);color:var(--accent);font-size:14px;font-weight:600;margin-right:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:600;color:var(--label3);text-align:center;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;touch-action:pan-y}
.day{height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:3px;position:relative;text-align:center}
.day.sel{background:var(--fill)}
.day.fut{opacity:.32}
.num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;position:relative;font-variant-numeric:tabular-nums}
.ring{position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.today .num{color:var(--accent);font-weight:700}
.num.full-g{background:var(--green);color:var(--onc)!important;font-weight:600}
.num.full-r{background:var(--red);color:var(--onc)!important;font-weight:600}
.num.full-c{color:var(--onc)!important;font-weight:600}
.num.tint-g{background:var(--green-t);color:var(--green)!important;font-weight:600}
.num.tint-o{background:var(--orange-t);color:var(--orange)!important;font-weight:600}
.num.tint-r{background:var(--red-t);color:var(--red)!important;font-weight:600}
.num.tint-n{background:var(--fill);color:var(--label2)!important;font-weight:600}
.me{font-size:11px;line-height:12px}
.under{height:12px;display:flex;align-items:center;justify-content:center;gap:3px;max-width:100%;padding:0 2px}
.ul{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.ul.g{color:var(--green)} .ul.o{color:var(--orange)} .ul.n{color:var(--label3)}
.cd{width:6px;height:6px;border-radius:50%;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--label2);padding:10px 4px 2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.clp{display:flex;align-items:center;justify-content:center;width:100%;height:26px;color:var(--label3)}
.clp span{width:44px;height:18px;border-radius:9px;background:var(--fill2);display:flex;align-items:center;justify-content:center}
.clp svg{width:14px;height:14px;stroke-width:2.8}

/* Summaries */
.sum{border-top:.5px solid var(--sep);margin:12px 4px 4px;padding-top:14px}
.sum-h{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--fill2);border-radius:14px;padding:10px 12px;min-width:0}
.tv{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv.sm{font-size:18px;line-height:1.48}
.tl{font-size:12px;color:var(--label2);margin-top:2px}
.tv.g{color:var(--green)} .tv.r{color:var(--red)} .tv.o{color:var(--orange)}
.dl{font-size:11px;font-weight:600;color:var(--label3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.gd{color:var(--green)} .dl.bd{color:var(--orange)}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(64px,auto) 1fr 26px;align-items:center;gap:10px;font-size:14px}
.bl{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.bt{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.bf{height:100%;border-radius:4px}
.bn{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label2)}

/* Section switch + day lists */
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px;gap:3px;margin:20px 0 0}
.switch button{height:38px;border-radius:9px;font-size:15px;font-weight:600;color:var(--label2);text-align:center}
.switch button.on{background:var(--segon);color:var(--label);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 4px 10px}
.sec-eye{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.sec-eye.today{color:var(--accent)}
.sec-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.txt{color:var(--accent);font-size:17px;padding:6px 2px}
.txt.b{font-weight:600}
.prog{display:flex;align-items:center;gap:12px;margin:0 4px 14px}
.pt{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:flex}
.pt b{display:block;height:100%}
.pn{font-size:14px;color:var(--label2);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.hrow{padding:14px 14px 14px 16px}
.htop{display:flex;align-items:center;gap:12px}
.hn{flex:1;min-width:0}
button.hn{display:block;text-align:left}
.hl{display:flex;align-items:center;gap:4px}
.hl .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hl svg{width:13px;height:13px;flex:none;color:var(--label3);stroke-width:2.8}
.pick{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--label3);display:flex;align-items:center;justify-content:center;color:var(--onc);flex:none}
.gbtn .pick svg{width:13px;height:13px;opacity:0;stroke-width:3.2}
.pick.on{background:var(--accent);border-color:var(--accent)}
.gbtn .pick.on svg{opacity:1}
.mdots{display:flex;gap:3px;flex:none}
.mdots i{width:9px;height:9px;border-radius:50%}
.lhead{text-align:center;padding:4px 16px 2px}
.lname{font-size:22px;font-weight:700;letter-spacing:-.02em}
.lsub{font-size:14px;color:var(--label2);margin-top:3px}
.ltiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ltiles .tile{background:var(--row)}
.lg-row{width:100%;text-align:left;font-size:16px;gap:12px}
.lg-d{flex:none;min-width:104px;color:var(--label2);font-size:15px}
.lg-v{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-v.g{color:var(--green)} .lg-v.r{color:var(--red)} .lg-v.o{color:var(--orange)}
.lg-edit{padding:4px 16px 14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hx{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label3);flex:none}
.hx svg{width:14px;height:14px}
.grow input[type=date]{min-height:22px}
.colors button.nb{background:linear-gradient(135deg,transparent 45%,var(--red) 45%,var(--red) 55%,transparent 55%),var(--row);box-shadow:inset 0 0 0 1.5px var(--label3)}
.colors button.nb.on{box-shadow:inset 0 0 0 1.5px var(--label3),0 0 0 2.5px var(--row),0 0 0 4.5px var(--label2)}
.hrow.hid{opacity:.55}
.hidnote{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;font-size:14px;color:var(--label2);text-align:center}
.hidnote svg{width:17px;height:17px}
.more{width:100%;height:44px;color:var(--accent);font-size:16px;text-align:center}
.hname{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:14px;color:var(--label3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub.g{color:var(--green)} .hsub.r{color:var(--red)} .hsub.o{color:var(--orange)}
.fbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--fill2);flex:none}
.fbtn svg{width:19px;height:19px}
.fbtn.on{background:var(--accent);color:var(--onc)}
.ebtns{display:flex;gap:6px;flex:none}
.ebtns button{width:36px;height:36px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label2)}
.ebtns button.p{color:var(--accent)}
.ebtns button:disabled{opacity:.3}
.ebtns svg{width:17px;height:17px}
.hctl{margin-top:12px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn{height:42px;border-radius:12px;background:var(--fill2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:600;color:var(--label2)}
.yn svg{width:17px;height:17px;stroke-width:2.6}
.yn.on-g{background:var(--green);color:var(--onc)}
.yn.on-r{background:var(--red);color:var(--onc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill2);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--label);font-variant-numeric:tabular-nums}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip .star{font-size:11px;color:var(--orange)}
.chip.on-g{background:var(--green);color:var(--onc)}
.chip.on-o{background:var(--orange);color:var(--onc)}
.chip.on-r{background:var(--red);color:var(--onc)}
.chip.on-n{background:var(--gray);color:var(--onc)}
.chip.on-a{background:var(--accent);color:var(--onc)}
.ngoal{font-size:13px;color:var(--label2);align-self:center;margin-left:2px}
.chip.on-c{color:var(--onc)}
.chip.on-c .dot{background:#fff!important;opacity:.85}
.chip.on-g .star,.chip.on-o .star{color:var(--onc)}
.chip.ghost{color:var(--label2)}
.add{width:100%;margin-top:10px;height:50px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent);font-size:17px;font-weight:600}
.add svg{width:18px;height:18px;stroke-width:2.5}
.empty{padding:28px 20px;text-align:center;color:var(--label2);font-size:15px}
.empty b{display:block;color:var(--label);font-size:17px;margin-bottom:4px}
.note{font-size:13px;color:var(--label3);margin:10px 6px 0;line-height:1.35}
.minihead{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:22px 6px 8px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;position:relative}
.prow+.prow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.prow .hn{opacity:.75}
.sbtn{height:32px;padding:0 14px;border-radius:16px;background:var(--fill);color:var(--accent);font-size:14px;font-weight:600;flex:none}
.sbtn.red{color:var(--red)}
.foot{text-align:center;font-size:12px;color:var(--label3);margin-top:26px}

/* Workouts */
.wlist{overflow:hidden}
.wrow{display:flex;align-items:center;gap:10px;padding:0 12px 0 0;min-height:58px;position:relative}
.wrow+.wrow::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--sep)}
.wmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 0 12px 16px;min-height:58px}
.wchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--label3);display:flex;align-items:center;justify-content:center;color:var(--onc);flex:none;transition:background .15s,border-color .15s}
.wchk svg{width:15px;height:15px;stroke-width:3;opacity:0}
.wchk.on{border-color:transparent}
.wchk.on svg{opacity:1}
.wname{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wname small{display:block;font-size:13px;font-weight:400;color:var(--label3);margin-top:1px}
.wbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 14px;font-size:14px;color:var(--label2);font-weight:500}
.wtag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--fill);color:var(--label);font-size:13px;font-weight:600}
.wtag i{width:8px;height:8px;border-radius:50%}

/* Profile page */
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 18px 18px}
.avatar{width:68px;height:68px;border-radius:50%;flex:none;overflow:hidden;background:linear-gradient(160deg,#c7c7cc,#8e8e93);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:600}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:34px;height:34px;opacity:.95}
.avatar.xl{width:96px;height:96px;font-size:36px}
.avatar.xl svg{width:48px;height:48px}
.phead .pname{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:12px}
.phead .psub{font-size:15px;color:var(--label2);margin-top:3px}
.phead .pbio{font-size:15px;margin-top:8px;color:var(--label);opacity:.85;max-width:340px}
.ph{color:var(--label3)}
.pedit{margin-top:14px;height:34px;padding:0 16px;border-radius:17px;background:var(--fill);color:var(--accent);font-size:15px;font-weight:600}
.pcard{padding:14px 14px 16px;margin-top:12px}
.pcard .sum-h{margin:0 2px 10px}
.yhead{display:flex;align-items:center;justify-content:space-between;margin:-4px -4px 8px 2px}
.yhead .sum-h{margin:0}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px}
.yr.two{grid-template-columns:1fr 1fr;gap:18px}
.yr.two .mm-g{gap:3px}
.yr.two .mm-g i{border-radius:5px}
.yr.two .mm-n{font-size:15px;margin-bottom:8px}
.pseg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:0 0 14px}
.pseg button{height:30px;border-radius:7px;font-size:12.5px;font-weight:600;text-align:center;color:var(--label2)}
.pseg button.on{background:var(--segon);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.yexp{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;padding:8px;color:var(--accent);font-size:15px;font-weight:600}
.yexp svg{width:14px;height:14px;stroke-width:2.8}
.mm{text-align:left;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;align-self:start}
.mm-n{font-size:13px;font-weight:600;margin-bottom:5px;color:var(--label)}
.mm-n.cur{color:var(--accent)}
.mm-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mm-g i{aspect-ratio:1;border-radius:3px;background:var(--fill2)}
.mm-g i.e{visibility:hidden}
.mm-g i.d{background:var(--green)}
.mm-g i.n{background:var(--orange);opacity:.75}
.mm-g i.hp{background:var(--orange)}
.mm-g i.hz{background:var(--red)}
.mm-g i.f{background:transparent;box-shadow:inset 0 0 0 1px var(--fill)}
.mm-g i.t{box-shadow:0 0 0 1.5px var(--accent)}

/* Settings page */
.page .group{background:var(--card)}
.si{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.si svg{width:17px;height:17px}
.rchev{margin-left:auto;color:var(--label3);display:flex;align-items:center;gap:6px;font-size:16px}
.rchev svg{width:15px;height:15px;stroke-width:2.6}
.rv{flex:1;text-align:right;color:var(--label2);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rv.warn{color:var(--orange)}
.rv.ok{color:var(--green)}

/* Sheets */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);transition:background .28s;display:flex;flex-direction:column;justify-content:flex-end}
.ov.open{background:rgba(0,0,0,.36)}
.sheet{background:var(--sheet);border-radius:14px 14px 0 0;max-height:calc(100% - env(safe-area-inset-top) - 16px);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);width:100%;max-width:560px;margin:0 auto}
.ov.open .sheet{transform:none}
.grab-zone{flex:none;padding-top:6px;touch-action:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 2px}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 16px 8px;min-height:44px}
.sh-head .txt:first-child{justify-self:start}
.sh-head .txt:last-child{justify-self:end}
.sh-title{font-size:17px;font-weight:600;text-align:center}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.glabel{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:18px 16px 7px}
.ghint{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.35}
.ghint.err{color:var(--red)}
.group{background:var(--row);border-radius:12px;overflow:hidden}
.grow{display:flex;align-items:center;min-height:46px;padding:0 16px;gap:12px;position:relative}
.grow+.grow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.grow label{font-size:17px;flex:none;min-width:84px}
.grow input,.grow select,.grow textarea{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--label);text-align:right;padding:12px 0;outline:none;-webkit-appearance:none;appearance:none}
.grow textarea{text-align:left;resize:none;min-height:70px;line-height:1.35}
.grow .full{text-align:left}
input::placeholder,textarea::placeholder{color:var(--label3)}

function upgradeFeel(d){
  if((d.feelU||0)>=FEEL2)return;
  var low=function(x){return String(x).trim().toLowerCase()},have=d.feel.map(function(f){return low(f.label)});
  if(['happy','anxious','sad','irritated'].some(function(l){return have.indexOf(l)>-1}))return;
  var oldDef=['energetic','rested','tired','stressed','calm','sick'];
  if(have.length===6&&oldDef.every(function(l,i){return have[i]===l})&&d.feel.every(function(f,i){return f.id==='f'+(i+1)}))d.feel=defaultFeel();
  else{
    var ids=d.feel.map(function(f){return f.id});
    FEEL_NEW.forEach(function(x){if(have.indexOf(low(x[1]))<0)d.feel.push({id:ids.indexOf(x[0])<0?x[0]:x[0]+'b',label:x[1]})});

  });

  d.workouts.forEach(function(w,i){
    if(!w.c)w.c=COLORS[i%COLORS.length];if(!w.created)w.created=today();
    if(!w.archived)w.archived=null;if(typeof w.o!=='number')w.o=i;if(typeof w.u!=='number')w.u=1;
  });
  Object.keys(d.log).forEach(function(k){if(!isObj(d.log[k])||!Object.keys(d.log[k]).length)delete d.log[k]});
  if(!isObj(d.wlog))d.wlog={};
  Object.keys(d.wlog).forEach(function(k){if(!Array.isArray(d.wlog[k])||!d.wlog[k].length)delete d.wlog[k]});
  if(!isObj(d.lt)){d.lt={};Object.keys(d.log).forEach(function(ds){Object.keys(d.log[ds]).forEach(function(hid){d.lt[ds+'|'+hid]=1})})}
  if(!isObj(d.wt)){d.wt={};Object.keys(d.wlog).forEach(function(ds){d.wt[ds]=1})}
  if(!isObj(d.del))d.del={};
  d.habits.forEach(function(h){if(h.type==='number'){if(typeof h.unit!=='string')h.unit='';if(typeof h.goal!=='number')h.goal=null;if(h.gdir!=='max')h.gdir='min'}});
  if(!isObj(d.day))d.day={};
  if(!isObj(d.dt))d.dt={};
  Object.keys(d.dt).forEach(function(k){if(k.indexOf('|')<0){var t0=d.dt[k];delete d.dt[k];['m','e','n'].forEach(function(p){if(d.day[k]&&d.day[k][p]!=null)d.dt[k+'|'+p]=t0})}});
  Object.keys(d.day).forEach(function(k){['m','e','n'].forEach(function(p){if(d.day[k][p]!=null&&!d.dt[k+'|'+p])d.dt[k+'|'+p]=1})});
  Object.keys(d.day).forEach(function(k){
    var x=d.day[k];if(!x.e)return;
    var m=x.m||{},e=x.e,mf=m.f||[],f=mf.concat((e.f||[]).filter(function(i){return mf.indexOf(i)<0}));
    var v=e.v||m.v;x.m={f:f};if(v)x.m.v=v;if(!v&&!f.length)delete x.m;delete x.e;

}
function load(){

    try{localStorage.setItem(KEY+'_unreadable_'+Date.now(),raw)}catch(e){}

/* merge two copies of the data (this phone + cloud). Newest change wins per item / per day. */
function mergeItems(xa,xb,del){
  var m={};
  xa.concat(xb).forEach(function(x){var c=m[x.id];if(!c||x.u>c.u)m[x.id]=x});
  return Object.keys(m).map(function(k){return clone(m[k])}).filter(function(x){return !(del[x.id]>=x.u)});
}
function merge(a,b){
  var out={v:3,pristine:false,profile:clone((b.profile.u>a.profile.u?b:a).profile),log:{},lt:{},wlog:{},wt:{},del:{}};
  [a.del,b.del].forEach(function(m){Object.keys(m).forEach(function(k){if(!(out.del[k]>=m[k]))out.del[k]=m[k]})});
  out.habits=mergeItems(a.habits,b.habits,out.del);
  out.workouts=mergeItems(a.workouts,b.workouts,out.del);
  var rs=(b.restU||0)>(a.restU||0)?b:a;out.restC=rs.restC||'#8e8e93';out.restU=Math.max(a.restU||0,b.restU||0);
  var fs=(b.feelU||0)>(a.feelU||0)?b:a;out.feel=clone(fs.feel||defaultFeel());out.feelU=Math.max(a.feelU||0,b.feelU||0);
  out.day={};out.dt={};var dk={};Object.keys(a.dt||{}).concat(Object.keys(b.dt||{})).forEach(function(k){dk[k]=1});
  Object.keys(dk).forEach(function(k){
    var ta=(a.dt||{})[k]||0,tb=(b.dt||{})[k]||0,src=tb>ta?b:a,i=k.indexOf('|'),ds=k.slice(0,i),part=k.slice(i+1);
    out.dt[k]=Math.max(ta,tb);
    var e=(src.day||{})[ds];if(e&&e[part]!=null){if(!out.day[ds])out.day[ds]={};out.day[ds][part]=clone(e[part])}
  });
  var hids={};out.habits.forEach(function(h){hids[h.id]=1});
  var keys={};Object.keys(a.lt).concat(Object.keys(b.lt)).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(k){
    var ta=a.lt[k]||0,tb=b.lt[k]||0,src=tb>ta?b:a,i=k.indexOf('|'),ds=k.slice(0,i),hid=k.slice(i+1);
    if(!hids[hid])return;
    out.lt[k]=Math.max(ta,tb);
    var e=src.log[ds],v=e?e[hid]:undefined;
    if(v!==undefined){if(!out.log[ds])out.log[ds]={};out.log[ds][hid]=clone(v)}
  });
  var wk={};Object.keys(a.wt).concat(Object.keys(b.wt)).forEach(function(k){wk[k]=1});
  Object.keys(wk).forEach(function(ds){
    var ta=a.wt[ds]||0,tb=b.wt[ds]||0,src=tb>ta?b:a;
    out.wt[ds]=Math.max(ta,tb);
    var arr=src.wlog[ds];if(arr&&arr.length)out.wlog[ds]=arr.slice();
  });
  sortItems(out);
  return out;
}

function aCol(h,v){
  if(h.type==='check'){if(v!==true&&v!==false)return null;return (h.ac&&h.ac[v===true?'y':'n'])||'var(--green)'}
  if(h.type==='single'){var o=optOf(h,v);if(!o)return null;if(o.ac)return o.ac;return(!hasGoal(h)||o.goal)?'var(--green)':'var(--orange)'}

function optOf(h,id){for(var i=0;i<h.options.length;i++)if(h.options[i].id===id)return h.options[i];return null}
function hasGoal(h){return h.options.some(function(o){return o.goal})}

/* 'done' | 'miss' | null (not logged) */
function status(h,v){
  if(v===undefined||v===null)return null;
  if(h.type==='check')return v===true?'done':v===false?'miss':v==='na'?'na':null;
  if(h.type==='number'){if(typeof v!=='number')return null;if(h.goal==null)return 'done';return (h.gdir==='max'?v<=h.goal:v>=h.goal)?'done':'miss'}
  if(h.type==='single'){var o=optOf(h,v);if(!o)return null;return(!hasGoal(h)||o.goal)?'done':'miss'}
  if(Array.isArray(v)){
    var n=v.filter(function(id){return optOf(h,id)}).length;
    if(n)return 'done';
    return v.length===0?'miss':null;
  }

function logged(h,ds){return status(h,val(ds,h))!==null}
function activePause(h){for(var i=0;i<h.pauses.length;i++)if(!h.pauses[i].to)return h.pauses[i];return null}

  for(var i=0;i<h.pauses.length;i++){var p=h.pauses[i];if(ds>=p.from&&(!p.to||ds<=p.to))return false}

function parseNum(x){x=String(x==null?'':x).trim().replace(',','.');if(!x)return null;var n=Number(x);return isFinite(n)?n:NaN}

  var ds=today(),last=null,n=0;
  for(var i=0;i<3660&&ds>=h.created;i++,ds=addDays(ds,-1)){

  return {n:n,l:last==='miss'?'No in a row':'Yes in a row'};
}
function streak(h){
  if(h.type==='check')return ynRun(h).n;
  var ds=today(),st=status(h,val(ds,h));
  if(st==='miss')return 0;
  if(st!=='done')ds=addDays(ds,-1);
  var n=0;
  for(var i=0;i<3660;i++){
    st=status(h,val(ds,h));
    if(st==='done'){n++;ds=addDays(ds,-1)}
    else if(st==='na'){ds=addDays(ds,-1)}
    else if(!st&&!applies(h,ds)&&ds>=h.created){ds=addDays(ds,-1)}
    else break;
  }
  return n;
}
/* ---------- workouts ---------- */
function W(id){for(var i=0;i<S.workouts.length;i++)if(S.workouts[i].id===id)return S.workouts[i];return null}
function wraw(ds){return S.wlog[ds]||[]}
function wdone(ds){return wraw(ds).map(W).filter(Boolean).sort(function(a,b){return a.o-b.o})}
function isRest(ds){return wraw(ds).indexOf(REST)>-1}
function restItem(){return {id:REST,name:'Rest day',c:S.restC||'#8e8e93'}}
function wLogged(ds){return wraw(ds).some(function(x){return x===REST||W(x)})}
function wReq(ds){return S.workouts.some(function(w){return w.created<=ds&&(!w.archived||ds<w.archived)})}
function setW(ds,arr){if(arr.length)S.wlog[ds]=arr;else delete S.wlog[ds];S.wt[ds]=Date.now();touch()}
function activeWorkouts(){return S.workouts.filter(function(w){return !w.archived})}
function lastDone(w){
  var ds=today();
  for(var i=0;i<730;i++){if(wraw(ds).indexOf(w.id)>-1)return i;ds=addDays(ds,-1)}
  return -1;
}
function weekCount(w){
  var ds=today(),n=0,k=dow(ds);
  for(var i=0;i<=k;i++){if(wraw(ds).indexOf(w.id)>-1)n++;ds=addDays(ds,-1)}
  return n;
}

/* ---------- day completeness: Done = everything registered (habits + a workout or rest day) ---------- */
function dayReg(ds){
  var need=0,have=0;
  for(var i=0;i<S.habits.length;i++){var h=S.habits[i],l=logged(h,ds);if(l||applies(h,ds)){need++;if(l)have++}}
  var wl=wLogged(ds);
  if(wl||wReq(ds)){need++;if(wl)have++}
  return {need:need,have:have};
}
function isDone(r){return r.need>0&&r.have===r.need}
function monthStats(y,m,lim){
  var n=new Date(y,m+1,0).getDate(),t=today(),s={done:0,inc:0,wd:0,ses:0,rest:0,tracked:0,per:{}};
  lim=Math.min(lim||n,n);
  for(var i=1;i<=lim;i++){
    var ds=ymd(new Date(y,m,i));if(ds>t)break;
    var r=dayReg(ds);
    if(r.need){s.tracked++;if(isDone(r))s.done++;else if(ds<t)s.inc++}
    var dn=wdone(ds);
    if(dn.length){s.wd++;s.ses+=dn.length;dn.forEach(function(w){s.per[w.id]=(s.per[w.id]||0)+1})}
    else if(isRest(ds)){s.rest++;s.per[REST]=(s.per[REST]||0)+1}
  }
  return s;
}
/* this month vs. the same days of last month */
function compareMonth(y,m){
  var n=new Date(),cur=y===n.getFullYear()&&m===n.getMonth(),lim=cur?n.getDate():31;
  var a=monthStats(y,m,lim),pd=new Date(y,m-1,1),b=monthStats(pd.getFullYear(),pd.getMonth(),lim);
  return {a:a,b:(b.tracked||b.wd||b.rest)?b:null,pm:monthShort(pd)};
}
function earliest(){
  var e=null;
  S.habits.concat(S.workouts).forEach(function(x){if(!e||x.created<e)e=x.created});
  Object.keys(S.log).concat(Object.keys(S.wlog)).forEach(function(k){if(!e||k<e)e=k});
  return e;
}
function doneStreaks(){
  var start=earliest(),t=today(),run=0,best=0;
  if(!start)return {cur:0,best:0};
  for(var ds=start,i=0;ds<=t&&i<4000;ds=addDays(ds,1),i++){
    var r=dayReg(ds);if(!r.need)continue;
    if(isDone(r)){run++;if(run>best)best=run}
    else if(ds<t)run=0;
  }
  return {cur:run,best:best};
}

function viewInfo(){
  var v=ui.view;
  if(v.indexOf('h:')===0){var h=H(v.slice(2));if(h&&!h.archived)return {k:'h',x:h}}
  else if(v.indexOf('w:')===0){var w=v.slice(2)===REST?restItem():W(v.slice(2));if(w&&!w.archived)return {k:'w',x:w}}
  else if(v.indexOf('m:')===0){
    var its=v.slice(2).split(',').map(viewItem).filter(Boolean);

function dayCell(date,v){
  var ds=ymd(date),t=today(),fut=ds>t,c={cls:'',ring:'',under:'',style:''};
  if(!fut){
    if(v.k==='all'){
      var r=dayReg(ds);
      if(r.need){
        if(isDone(r))c.cls='full-g';
        else if(ds===t){var a=r.have/r.need*100;c.ring='<span class="ring" style="background:conic-gradient(var(--green) 0 '+a+'%,var(--track) '+a+'% 100%)"></span>'}
        else c.cls='tint-o';
      }
    }else if(v.k==='mood'){
      var dd=DAY(ds),mv=dayMood(ds);
      if(mv){c.style='background:color-mix(in srgb,'+MOODS[Math.round(mv)].c+' 30%,transparent)'}
      c.under=[dd.m,dd.e].map(function(x){return x&&x.v?'<span class="me" style="color:'+MOODS[x.v].c+'">'+faceSvg(x.v)+'</span>':''}).join('');
    }else if(v.k==='wall'){
      var dn=wdone(ds);
      if(dn.length)c.under=dn.slice(0,4).map(function(w){return '<span class="cd" style="background:'+w.c+'"></span>'}).join('');
      else if(isRest(ds))c.under='<span class="cd" style="background:'+restItem().c+'"></span>';
    }else if(v.k==='m'){
      var onI=v.items.filter(function(it){return it.on(ds)}),relI=v.items.filter(function(it){return it.on(ds)||it.rel(ds)});
      if(onI.length){c.under=onI.slice(0,5).map(function(it){return '<span class="cd" style="background:'+it.c+'"></span>'}).join('');if(onI.length===relI.length)c.cls='tint-g'}
    }else if(v.k==='w'){
      if(wraw(ds).indexOf(v.x.id)>-1){c.cls='full-c';c.style='background:'+v.x.c}
    }else{
      var h=v.x,val0=val(ds,h),st=status(h,val0);
      if(h.type==='check'){if(st==='done'||st==='miss'){var ac=aCol(h,val0);c.cls='full-c';c.style='background:'+ac;c.under='<span class="ul" style="color:'+ac+'">'+(st==='done'?'Yes':'No')+'</span>'}else if(st==='na'){c.cls='tint-n';c.under='<span class="ul n">N/A</span>'}}
      else if(h.type==='number'){if(st){c.cls=st==='done'?'tint-g':'tint-o';c.under='<span class="ul '+(st==='done'?'g':'o')+'">'+esc(fmtNum(val0))+'</span>'}}
      else if(h.type==='single'){
        if(st){var o=optOf(h,val0),ac=aCol(h,val0);c.cls='tint-x';c.style='--xc:'+ac;c.under='<span class="ul" style="color:'+ac+'">'+esc(o.label)+'</span>'}
      }else if(Array.isArray(val0)){
        if(st==='miss')c.cls='tint-r';
        else if(st==='done')c.under=val0.map(function(id){return optOf(h,id)}).filter(Boolean).slice(0,4).map(function(o){return '<span class="cd" style="background:'+o.c+'"></span>'}).join('');
      }
    }
  }
  return '<button class="day'+(ds===ui.sel?' sel':'')+(ds===t?' today':'')+(fut?' fut':'')+'" data-a="day" data-d="'+ds+'"'+(fut?' disabled':'')+'>'+
    '<span class="num '+c.cls+'"'+(c.style?' style="'+c.style+'"':'')+'>'+c.ring+date.getDate()+'</span><span class="under">'+c.under+'</span></button>';
}
function li(c,l){return '<span><i style="background:'+c+'"></i>'+l+'</span>'}

/* active workouts + archived ones that were done this month */
function monthWorkouts(){
  var st=monthStats(ui.month.getFullYear(),ui.month.getMonth());

function tile(v,l,c,extra){return '<div class="tile"><div class="tv '+(c||'')+'">'+v+'</div><div class="tl">'+l+'</div>'+(extra||'')+'</div>'}
function delta(cur,prev,better,pm){
  if(prev==null)return '';
  var d=cur-prev;
  if(!d)return '<div class="dl">Same as '+esc(pm)+'</div>';
  var good=better==='up'?d>0:better==='down'?d<0:null;
  return '<div class="dl'+(good===null?'':good?' gd':' bd')+'">'+(d>0?'↑':'↓')+Math.abs(d)+' vs '+esc(pm)+'</div>';
}
function bars(rows){
  var max=Math.max.apply(null,rows.map(function(r){return r.n}).concat([1]));
  return '<div class="bars">'+rows.map(function(r){
    return '<div class="bar"><div class="bl">'+r.l+'</div><div class="bt"><div class="bf" style="width:'+(r.n/max*100)+'%;background:'+r.c+'"></div></div><div class="bn">'+r.n+'</div></div>';
  }).join('')+'</div>';
}
function overviewTiles(y,m){
  var c=compareMonth(y,m),a=c.a,b=c.b;

    tile(a.inc,'Incomplete','o',delta(a.inc,b&&b.inc,'down',c.pm))+
    tile(a.wd,'Workout days','',delta(a.wd,b&&b.wd,'up',c.pm))+'</div>';

function summary(v){
  var y=ui.month.getFullYear(),m=ui.month.getMonth(),mn=esc(monthName(ui.month));
  var t=today(),first=ymd(new Date(y,m,1));
  if(first>t)return '<div class="sum"><div class="sum-h">'+mn+'</div><div class="tl">Nothing to show yet.</div></div>';
  if(v.k==='all')return '<div class="sum"><div class="sum-h">'+mn+' overview</div>'+overviewTiles(y,m)+'</div>';
  if(v.k==='mood')return moodSummary(y,m,mn);
  if(v.k==='m'){
    var mc=v.items.map(function(){return 0}),alld=0,part=0,dim=new Date(y,m+1,0).getDate();
    for(var q=1;q<=dim;q++){
      var dq=ymd(new Date(y,m,q));if(dq>t)break;
      var rel=0,onn=0;
      v.items.forEach(function(it,k){var o=it.on(dq);if(o)mc[k]++;if(o||it.rel(dq)){rel++;if(o)onn++}});
      if(rel){if(onn===rel)alld++;else if(dq<t)part++}
    }
    return '<div class="sum"><div class="sum-h">Selected in '+mn+'</div><div class="tiles">'+tile(alld,'All done','g')+tile(part,'Not all','o')+tile(v.items.length,'Selected')+'</div>'+
      bars(v.items.map(function(it,k){return {l:'<span class="cd" style="background:'+it.c+'"></span>'+esc(it.name),n:mc[k],c:it.c}}))+'</div>';
  }

      tile(a.wd,'Workout days','g',delta(a.wd,b&&b.wd,'up',c.pm))+tile(a.ses,'Sessions','',delta(a.ses,b&&b.ses,'up',c.pm))+
      tile(a.rest,'Rest days','',delta(a.rest,b&&b.rest,null,c.pm))+'</div>'+
      bars(monthWorkouts().map(function(w){return {l:'<span class="cd" style="background:'+w.c+'"></span>'+esc(w.name),n:full.per[w.id]||0,c:w.c}}))+'</div>';
  }
  var days=[],n=new Date(y,m+1,0).getDate();
  for(var i=1;i<=n;i++){var ds=ymd(new Date(y,m,i));if(ds<=t)days.push(ds)}
  if(v.k==='w'){
    var w=v.x,cm=compareMonth(y,m),times=cm.a.per[w.id]||0,pt=cm.b?(cm.b.per[w.id]||0):null;
    var ld=lastDone(w),lt=ld<0?'–':ld===0?'Today':ld===1?'Yesterday':ld+' days';
    return '<div class="sum"><div class="sum-h">'+esc(w.name)+' in '+mn+'</div><div class="tiles">'+tile(times,'Times','',delta(times,pt,'up',cm.pm))+tile(weekCount(w),'This week')+
      '<div class="tile"><div class="tv sm">'+lt+'</div><div class="tl">'+(ld>1?'Since last time':'Last time')+'</div></div></div></div>';
  }
  var h=v.x,cnt={},done=0,miss=0;
  days.forEach(function(ds){
    var vv=val(ds,h),st=status(h,vv);
    if(st==='done')done++;else if(st==='miss')miss++;
    if(h.type==='single'&&st)cnt[vv]=(cnt[vv]||0)+1;
    if(h.type==='multi'&&Array.isArray(vv))vv.forEach(function(id){cnt[id]=(cnt[id]||0)+1});
  });
  var sk=streak(h),head='<div class="sum"><div class="sum-h">'+esc(h.name)+' in '+mn+'</div>';
  if(h.type==='check'){var yr=ynRun(h);return head+'<div class="tiles">'+tile(done,'Yes')+tile(miss,'No')+tile(yr.n||'\u2013',yr.n?yr.l:'In a row')+'</div></div>'}
  if(h.type==='number'){
    var nn=0,sum=0;days.forEach(function(ds){var vv=val(ds,h);if(typeof vv==='number'){nn++;sum+=vv}});
    var avg=nn?fmtNum(sum/nn):'\u2013',u=h.unit?' ('+esc(h.unit)+')':'';
    return head+'<div class="tiles">'+(h.goal!=null?tile(done,'On goal','g')+tile(avg,'Average'+u)+tile(sk,'Day streak'):tile(nn,'Days logged')+tile(avg,'Average'+u)+tile(fmtNum(sum),'Total'+u))+'</div></div>';
  }
  if(h.type==='single'){
    var g=hasGoal(h);
    var tt=g?tile(done,'On goal','g')+tile(miss,'Other answer','o'):tile(done,'Days logged')+tile('–','No goal set');
    return head+'<div class="tiles">'+tt+tile(sk,'Day streak')+'</div>'+
      bars(h.options.map(function(o){return {l:(o.goal&&g?'<span style="color:var(--orange);font-size:11px">★</span>':'')+esc(o.label),n:cnt[o.id]||0,c:aCol(h,o.id)}}))+'</div>';
  }
  return head+'<div class="tiles">'+tile(done,'Active days','g')+tile(miss,'None','r')+tile(sk,'Day streak')+'</div>'+

function moodSummary(y,m,mn){
  var t=today(),dim=new Date(y,m+1,0).getDate(),logged=0,good=0,low=0,cnt=[0,0,0,0,0,0],fc={};
  for(var q=1;q<=dim;q++){
    var ds=ymd(new Date(y,m,q));if(ds>t)break;
    var d=DAY(ds),mv=dayMood(ds);
    if(mv){logged++;if(mv>=4)good++;else if(mv<=2)low++}
    [d.m,d.e].forEach(function(x){if(!x)return;if(x.v)cnt[x.v]++;(x.f||[]).forEach(function(id){if(feelOf(id))fc[id]=(fc[id]||0)+1})});
  }
  var fl=S.feel.filter(function(f){return fc[f.id]});
  return '<div class="sum"><div class="sum-h">Mood in '+mn+'</div><div class="tiles">'+tile(logged,'Days logged')+tile(good,'Good days','g')+tile(low,'Low days','o')+'</div>'+
    bars(MOODS.slice(1).reverse().map(function(md){return {l:'<span class="me" style="color:'+md.c+'">'+faceSvg(md.v)+'</span>'+md.l,n:cnt[md.v],c:md.c}}))+
    (fl.length?'<div class="sum-h" style="margin-top:16px">How you felt</div>'+bars(fl.map(function(f){return {l:esc(f.label),n:fc[f.id],c:'var(--accent)'}})):'')+'</div>';

function daysText(days){
  if(days.length===7)return 'Every day';
  var s=days.slice().sort().join('');
  if(s==='01234')return 'Weekdays';
  if(s==='56')return 'Weekends';
  return days.slice().sort().map(function(i){return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}).join(', ');
}
function habitLine(h,ds){
  var v=val(ds,h),st=status(h,v),a=answerText(h,v),cls='',ic='',ac=(st==='done'||st==='miss')?aCol(h,v):null,dst='';
  if(ac){cls='cc';ic=I.check;dst=' style="background:'+ac+';border-color:'+ac+'"'}
  else if(st==='done'){cls='g';ic=I.check}
  else if(st==='miss'){cls=(h.type==='single'||h.type==='number')?'o':'r';ic=(h.type==='single'||h.type==='number')?I.check:I.x}
  else if(st==='na'){cls='n';ic=I.minusLine}
  var bg=h.bg?' style="background:color-mix(in srgb,'+h.bg+' var(--tintp),var(--card))"':'';
  bg=bg?bg.replace('style="','style="--hc:'+h.c+';'):' style="--hc:'+h.c+'"';
  return '<button class="hline"'+bg+' data-a="ans-open" data-id="'+h.id+'"><span class="sdot '+cls+'"'+dst+'>'+ic+'</span>'+
    '<span class="hname">'+esc(h.name)+'</span><span class="hans '+(st==='na'?'n':a.c)+'"'+(ac?' style="color:'+ac+'"':'')+'>'+(st?esc(a.t):'\u2013')+'</span>'+I.chevR+'</button>';
}
function habitRow(h,ds){
  var v=val(ds,h),st=status(h,v),sub,sc='';
  if(!st)sub='Not filled in';
  else if(h.type==='check'){sub=st==='done'?'Yes':st==='na'?'N/A':'No';sc=''}
  else if(h.type==='number'){sub=esc(numText(h,v))+(h.goal!=null?(st==='done'?' \u00b7 On goal':' \u00b7 Not on goal'):'');sc=st==='done'?'g':'o'}
  else if(h.type==='single'){var o=optOf(h,v);sub=esc(o.label)+(hasGoal(h)?(st==='done'?' · On goal':' · Not on goal'):'');sc=st==='done'?'g':'o'}
  else{
    var ls=v.map(function(id){var o=optOf(h,id);return o?esc(o.label):null}).filter(Boolean);
    sub=ls.length?ls.join(', '):'None';sc=ls.length?'g':'r';
  }
  var on=ui.view==='h:'+h.id;

    '<button class="hn" data-a="h-log" data-id="'+h.id+'"><div class="hname hl"><span class="tx">'+esc(h.name)+'</span>'+I.chevR+'</div><div class="hsub '+sc+'">'+sub+'</div></button>'+
    (h.archived?'':'<button class="fbtn'+(on?' on':'')+'" data-a="focus" data-v="h:'+h.id+'" aria-label="Show in calendar">'+I.cal+'</button>')+
    '</div><div class="hctl">'+controls(h,v)+'</div></div>';

function controls(h,v,ds){
  var id=' data-h="'+h.id+'"'+(ds?' data-d="'+ds+'"':'');
  if(h.type==='check'){
    return '<div class="chips"><button class="chip'+(v===true?' on-c" style="background:'+aCol(h,true):'')+'" data-a="log-check"'+id+' data-v="1">Yes</button>'+
      '<button class="chip'+(v===false?' on-c" style="background:'+aCol(h,false):'')+'" data-a="log-check"'+id+' data-v="0">No</button>'+
      '<button class="chip'+(v==='na'?' on-n':'')+'" data-a="log-check"'+id+' data-v="na">N/A</button></div>';
  }
  if(h.type==='number'){
    var has=typeof v==='number',nst=status(h,v);
    return '<div class="chips"><button class="chip'+(has?(nst==='done'?' on-g':' on-o'):'')+'" data-a="num-open"'+id+'>'+(has?esc(numText(h,v)):'Enter amount')+'</button>'+
      (h.goal!=null?'<span class="ngoal">Goal '+esc(goalText(h))+'</span>':'')+'</div>';
  }

    return '<div class="chips">'+h.options.map(function(o){

  }).join('')+'<button class="chip ghost'+(Array.isArray(v)&&v.length===0?' on-r':'')+'" data-a="log-none"'+id+'>None</button></div>';

function avatarInner(p){
  if(p.photo)return '<img src="'+p.photo+'" alt="">';
  var n=(p.name||'').trim();
  if(n){var parts=n.split(/\s+/);return esc((parts[0][0]+(parts.length>1?parts[parts.length-1][0]:'')).toUpperCase())}
  return I.personFill;
}
function yCell(ds,mode){
  if(mode==='workouts'){
    var dn=wdone(ds);if(dn.length)return ' style="background:'+dn[0].c+'"';
    if(isRest(ds))return ' style="background:'+restItem().c+'"';
    return '';
  }
  if(mode==='mood'){var mv=dayMood(ds);return mv?' style="background:'+MOODS[Math.round(mv)].c+'"':''}
  if(mode==='habits'){
    var con=0,dn2=0,lg=0;
    S.habits.forEach(function(h){
      if(h.hidden)return;
      var st=status(h,val(ds,h));
      if(st==='na')return;
      if(st||applies(h,ds)){con++;if(st){lg++;if(st==='done'||(h.type==='check'&&st==='miss'))dn2++}}
    });
    if(!con||!lg)return '';
    if(dn2===con)return ' class="d"';
    if(dn2>0)return ' class="hp"';
    return ' class="hz"';
  }
  var r=dayReg(ds);
  if(!r.need)return '';
  if(isDone(r))return ' class="d"';
  return ds<today()?' class="n"':'';
}
function yMonth(y,m,mode,big){
  var t=today(),n=new Date(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cells='';
  for(var e=0;e<off;e++)cells+='<i class="e"></i>';
  for(var d=1;d<=dim;d++){
    var ds=ymd(new Date(y,m,d)),a='';
    if(ds>t)a=' class="f"';else a=yCell(ds,mode);
    if(ds===t)a=a.indexOf('class="')>-1?a.replace('class="','class="t '):a+' class="t"';
    cells+='<i'+a+'></i>';
  }
  var cur=y===n.getFullYear()&&m===n.getMonth(),dt=new Date(y,m,1);
  return '<button class="mm" data-a="ym" data-y="'+y+'" data-m="'+m+'"><div class="mm-n'+(cur?' cur':'')+'">'+esc(big?monthName(dt):monthShort(dt))+'</div><div class="mm-g">'+cells+'</div></button>';
}
function yLegend(mode){

  if(mode==='mood')return '<div class="legend" style="padding-top:14px">'+MOODS.slice(1).reverse().map(function(m){return li(m.c,m.l)}).join('')+'</div>';
  if(mode==='habits')return '<div class="legend" style="padding-top:14px">'+li('var(--green)','All done')+li('var(--orange)','Some done')+li('var(--red)','None done')+'</div>';
  return '<div class="legend" style="padding-top:14px">'+li('var(--green)','Done')+li('var(--orange)','Incomplete')+'</div>';

    '</div></div><div class="sh-body">'+o.body+'</div></div>';
  document.body.appendChild(ov);
  document.body.classList.add('locked');
  ov.getBoundingClientRect();
  ov.classList.add('open');

function closeSheet(instant){
  var ov=$('.ov');if(!ov)return;
  document.body.classList.remove('locked');
  if(instant){ov.remove();return}
  ov.classList.remove('open');
  setTimeout(function(){ov.remove()},300);
}
function attachDrag(ov){
  var sh=$('.sheet',ov),z=$('.grab-zone',ov),y0=null,dy=0;
  z.addEventListener('touchstart',function(e){if(e.target.closest('button'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});
  z.addEventListener('touchmove',function(e){if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform='translateY('+dy+'px)'},{passive:true});
  z.addEventListener('touchend',function(){if(y0===null)return;y0=null;sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet()});
}
function dialog(o){

var YEARS=[];
function monthPicker(){
  var cy=new Date().getFullYear(),first=cy-5,shown=ui.collapsed?parseD(ui.sel):ui.month;
  Object.keys(S.log).concat(Object.keys(S.wlog)).forEach(function(k){var y=+k.slice(0,4);if(y&&y<first)first=y});
  YEARS=[];for(var y=first;y<=cy+5;y++)YEARS.push(y);
  var mh=MONTHS.map(function(m,i){return '<button class="wi" data-a="wi" data-i="'+i+'">'+m+'</button>'}).join('');
  var yh=YEARS.map(function(y,i){return '<button class="wi" data-a="wi" data-i="'+i+'">'+y+'</button>'}).join('');
  openSheet({title:'Choose month',left:'Close',right:'Done',rightA:'mp-done',body:
    '<div class="wheels"><div class="wband"></div>'+
      '<div class="wheel" id="wh-m"><div class="wsp"></div>'+mh+'<div class="wsp"></div></div>'+
      '<div class="wheel" id="wh-y"><div class="wsp"></div>'+yh+'<div class="wsp"></div></div>'+
    '</div><button class="mp-today" data-a="mp-today">Go to today</button>',
    mount:function(){
      var wm=$('#wh-m'),wy=$('#wh-y');
      [wm,wy].forEach(function(w){
        var raf=0;
        w.addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(function(){raf=0;paintWheel(w)})},{passive:true});
      });
      setWheel(wm,shown.getMonth(),false);
      setWheel(wy,Math.max(0,YEARS.indexOf(shown.getFullYear())),false);
    }});
}
function setWheel(w,i,smooth){
  if(smooth&&w.scrollTo)w.scrollTo({top:i*40,behavior:'smooth'});else w.scrollTop=i*40;
  paintWheel(w);
}
function wheelIndex(w){var n=$$('.wi',w).length;return Math.max(0,Math.min(n-1,Math.round(w.scrollTop/40)))}
function paintWheel(w){
  var st=w.scrollTop,sel=wheelIndex(w);
  $$('.wi',w).forEach(function(el,i){
    var d=(i*40-st)/40,ad=Math.min(Math.abs(d),4);
    el.style.transform='rotateX('+(-d*17)+'deg)';
    el.style.opacity=String(Math.max(.28,1-ad*.2));
    el.classList.toggle('on',i===sel);
  });
}
function goMonth(y,m){
  ui.month=new Date(y,m,1);
  var t=today(),first=ymd(ui.month),cur=new Date();
  if(y===cur.getFullYear()&&m===cur.getMonth())ui.sel=t;
  else if(first<=t)ui.sel=first;
}

function readPhoto(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var s=320,c=document.createElement('canvas');c.width=c.height=s;
        var k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;
        c.getContext('2d').drawImage(img,(s-w)/2,(s-h)/2,w,h);
        res(c.toDataURL('image/jpeg',.82));
      };
      img.onerror=rej;img.src=r.result;
    };
    r.onerror=rej;r.readAsDataURL(file);
  });
}

  if(b.type==='single'&&ga!==gb)out.push(gb?'Goal set to '+gb:'Goal removed');
  if(b.type==='number'&&(a.goal!==b.goal||a.gdir!==b.gdir))out.push(b.goal!=null?'Goal set to '+goalText(b):'Goal removed');

function answerText(h,v){

  if(h.type==='check')return st==='na'?{t:'N/A',c:''}:{t:st==='done'?'Yes':'No',c:'g'};

  if(h.type==='single'){var o=optOf(h,v);return {t:o.label,c:st==='done'?'g':'o'}}
  var ls=v.map(function(id){var o=optOf(h,id);return o?o.label:null}).filter(Boolean);

function habitStats(h){
  var t=today(),s={done:0,miss:0,none:0,na:0,cnt:{},best:0,sum:0,nn:0},run=0;
  var first=h.created;
  Object.keys(S.log).forEach(function(ds){if(ds<first&&S.log[ds][h.id]!==undefined)first=ds});
  for(var ds=first,i=0;ds<=t&&i<6000;ds=addDays(ds,1),i++){
    var v=val(ds,h),st=status(h,v);
    if(st==='done'){s.done++;run++;if(run>s.best)s.best=run}
    else if(st==='miss'){s.miss++;run=0}
    else if(st==='na'){s.na++}
    else if(applies(h,ds)){if(ds<t){s.none++;run=0}}
    if(h.type==='number'&&typeof v==='number'){s.sum+=v;s.nn++}
    if(h.type==='single'&&st)s.cnt[v]=(s.cnt[v]||0)+1;
    if(h.type==='multi'&&Array.isArray(v))v.forEach(function(x){if(optOf(h,x))s.cnt[x]=(s.cnt[x]||0)+1});
  }
  var tot=s.done+s.miss+s.none;s.rate=tot?Math.round(s.done/tot*100)+'%':'–';
  var top=null;Object.keys(s.cnt).forEach(function(k){if(!top||s.cnt[k]>s.cnt[top])top=k});
  s.top=top?optOf(h,top).label+' ('+s.cnt[top]+'×)':null;
  return s;
}

/* ---------- cloud sync (Supabase) ---------- */
function loadSync(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}}
var SY=loadSync();
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(SY))}catch(e){}}
function signedIn(){return !!(SY.rt&&SY.url&&SY.key&&SY.uid)}
var syncing=false,again=false,syncTimer=0;
function scheduleSync(){if(!signedIn())return;clearTimeout(syncTimer);syncTimer=setTimeout(sync,1500)}
function authCall(path,body){
  return fetch(SY.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:SY.key,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var e=new Error(j.error_description||j.msg||j.message||('Error '+r.status));e.status=r.status;e.auth=true;throw e}
      return j;
    })});
}
function setTokens(j){SY.at=j.access_token;SY.rt=j.refresh_token;SY.exp=Date.now()+((j.expires_in||3600)*1000);if(j.user&&j.user.id)SY.uid=j.user.id;saveSync()}
function getToken(){
  if(SY.at&&Date.now()<SY.exp-60000)return Promise.resolve(SY.at);
  return authCall('token?grant_type=refresh_token',{refresh_token:SY.rt}).then(function(j){setTokens(j);return SY.at});
}
function api(method,qs,body,tok){
  return fetch(SY.url+'/rest/v1/'+TABLE+qs,{method:method,
    headers:{apikey:SY.key,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
    body:body?JSON.stringify(body):undefined}).then(function(r){
      if(!r.ok)return r.text().then(function(t){var m='Error '+r.status;try{var j=JSON.parse(t);m=j.message||j.hint||m}catch(x){}var e=new Error(m);e.status=r.status;throw e});
      return method==='GET'?r.json():null;
    });
}
function sync(){
  if(!signedIn())return Promise.resolve();
  if(syncing){again=true;return Promise.resolve()}
  syncing=true;paintSync();
  var tok;
  return getToken().then(function(t){tok=t;return api('GET','?select=data',null,tok)}).then(function(rows){
    var remote=rows&&rows[0]&&valid(rows[0].data)?norm(rows[0].data):null;
    var merged=!remote?S:(S.pristine?remote:merge(S,remote));
    var mj=JSON.stringify(merged);
    if(mj!==JSON.stringify(S)){S=merged;save();render()}
    if(!remote||mj!==JSON.stringify(remote))return api('POST','?on_conflict=user_id',{user_id:SY.uid,data:merged,updated_at:new Date().toISOString()},tok);
  }).then(function(){SY.last=Date.now();SY.err='';saveSync()})
  .catch(function(e){
    if(e&&e.auth&&e.status>=400&&e.status<500){SY.rt='';SY.at='';SY.err='Signed out — please sign in again'}
    else if(navigator.onLine===false||e instanceof TypeError)SY.err='Offline — will sync when online';
    else SY.err=(e&&e.message)||'Sync failed';
    saveSync();
  }).then(function(){syncing=false;paintSync();if(again){again=false;scheduleSync()}});
}

function delHabit(id,fromSheet){
  var h=H(id);
  dialog({title:'Delete “'+h.name+'”?',msg:'This also deletes its whole history. Archive it instead if you want to keep the history.',ok:'Delete',destructive:true}).then(function(ok){
    if(!ok)return;
    S.habits=S.habits.filter(function(x){return x.id!==id});
    S.del[id]=Date.now();
    Object.keys(S.log).forEach(function(ds){delete S.log[ds][id];if(!Object.keys(S.log[ds]).length)delete S.log[ds]});
    Object.keys(S.lt).forEach(function(k){if(k.slice(k.indexOf('|')+1)===id)delete S.lt[k]});
    if(ui.view==='h:'+id)ui.view='all';
    if(!activeHabits().length)ui.edit=false;
    touch();if(fromSheet)closeSheet();else $('#ab').innerHTML=archivedBody();render();toast('Habit deleted');
  });
}
function delWorkout(id,fromSheet){
  var w=W(id);
  dialog({title:'Delete “'+w.name+'”?',msg:'It will also be removed from every day you logged it. Archive it instead if you want to keep the history.',ok:'Delete',destructive:true}).then(function(ok){

    var n=Date.now();

function onField(e){
  var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(!f)return;
  var v=e.target.value;
  if(f.indexOf('p-')===0&&pdraft)pdraft[f.slice(2)]=v;
  else if(f==='h-name'&&draft)draft.name=v;
  else if(f==='h-unit'&&draft)draft.unit=v;
  else if(f==='h-goalv'&&draft)draft.goalS=v;
  else if(f==='fe'&&fdraft){var fe=fdraft[+e.target.getAttribute('data-i')];if(fe)fe.label=v}
  else if(f==='h-opt'&&draft){var o=draft.options[+e.target.getAttribute('data-i')];if(o)o.label=v}
  else if(f==='w-name'&&wdraft)wdraft.name=v;
  else if(f.indexOf('s-')===0&&sdraft)sdraft[f.slice(2)]=v;
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){
  onField(e);
  var lf=e.target.getAttribute&&e.target.getAttribute('data-f');
  if(lf&&lf.indexOf('l-')===0&&logH){
    var lh=H(logH),lv=e.target.value;
    if(lf==='l-start'&&lv&&lv<=today()&&lv!==lh.created){lh.created=lv;lh.hist.push({d:today(),t:'Start date set to '+niceDate(lv)});lh.u=Date.now();touch();afterLog()}
    else if(lf==='l-start'){e.target.value=lh.created}
    if(lf==='l-day'&&lv&&lv<=today()){logOpen=lv;refreshLog()}
    if(lf==='l-note'){lh.note=lv.slice(0,300);lh.u=Date.now();touch()}
  }
  if(e.target.id==='photo-in'&&e.target.files&&e.target.files[0]){
    readPhoto(e.target.files[0]).then(function(url){pdraft.photo=url;refreshPhoto()}).catch(function(){toast('Couldn’t read that photo')});
  }
  if(e.target.id==='imp-in'&&e.target.files&&e.target.files[0]){
    var r=new FileReader();
    r.onload=function(){
      var d;try{d=JSON.parse(r.result)}catch(x){d=null}
      if(!valid(d)){toast('That file isn’t a Daily Hub backup');return}
      d=norm(d);
      dialog({title:'Import this backup?',msg:'The backup has '+d.habits.length+' habits and '+Object.keys(d.log).length+' logged days. It is combined with the data on this phone — nothing newer is overwritten.',ok:'Import'}).then(function(ok){
        if(!ok)return;S=S.pristine?d:merge(S,d);S.pristine=false;ui.view='all';ui.edit=false;touch();render();toast('Backup imported');
      });
    };
    r.readAsText(e.target.files[0]);
  }
