<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08);
  --track:rgba(120,120,128,.18);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.16);
  --accent:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --gray:#8e8e93;
  --green-t:rgba(52,199,89,.16); --red-t:rgba(255,59,48,.14); --orange-t:rgba(255,149,0,.18);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --sheet:#f2f2f7; --row:#fff; --bar:rgba(249,249,249,.88); --segon:#fff; --tintp:16%;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16);
    --track:rgba(120,120,128,.32);
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
    --accent:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --gray:#8e8e93;
    --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.22);
    --shadow:none; --sheet:#1c1c1e; --row:#2c2c2e; --bar:rgba(22,22,22,.88); --segon:#636366; --tintp:28%;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--label);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;line-height:1.3}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-align:inherit}
button:disabled{cursor:default}
svg{display:block}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--label2);margin:0 2px 4px}
.big{font-size:32px;font-weight:700;letter-spacing:-.025em;margin:0 2px 16px;line-height:1.15}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);max-width:560px;margin:0 auto}
.tab{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--gray);text-align:center}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}

/* Cards + calendar */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.cal{padding:14px 12px 6px}
.cal-top{display:flex;align-items:center;gap:8px;padding:0 4px 12px}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:17px;background:var(--fill);font-size:15px;font-weight:600;max-width:100%;min-width:0}
.pill .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill svg{width:16px;height:16px;flex:none}
.pill .chev svg{width:14px;height:14px;opacity:.5}
.pdot{width:10px;height:10px;border-radius:50%;flex:none}
.pill-x{width:34px;height:34px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label2);flex:none}
.pill-x svg{width:15px;height:15px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.mtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;padding:4px 0}
.mtitle span{color:var(--accent)}
.mtitle svg{width:16px;height:16px;color:var(--accent);stroke-width:3}
.navbtns{display:flex;align-items:center;gap:4px}
.nbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.nbtn:active{background:var(--fill)}
.nbtn svg{width:22px;height:22px}
.tbtn{height:30px;padding:0 12px;border-radius:15px;background:var(--fill);color:var(--accent);font-size:14px;font-weight:600;margin-right:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:600;color:var(--label3);text-align:center;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;touch-action:pan-y}
.day{height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;gap:3px;position:relative;text-align:center}
.day.sel{background:var(--fill)}
.day.fut{opacity:.32}
.num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;position:relative;font-variant-numeric:tabular-nums}
.ring{position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.today .num{color:var(--accent);font-weight:700}
.num.full-g{background:var(--green);color:#fff!important;font-weight:600}
.num.full-r{background:var(--red);color:#fff!important;font-weight:600}
.num.full-c{color:#fff!important;font-weight:600}
.num.tint-g{background:var(--green-t);color:var(--green)!important;font-weight:600}
.num.tint-o{background:var(--orange-t);color:var(--orange)!important;font-weight:600}
.num.tint-r{background:var(--red-t);color:var(--red)!important;font-weight:600}
.under{height:12px;display:flex;align-items:center;justify-content:center;gap:3px;max-width:100%;padding:0 2px}
.ul{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.ul.g{color:var(--green)} .ul.o{color:var(--orange)} .ul.n{color:var(--label3)}
.cd{width:6px;height:6px;border-radius:50%;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--label2);padding:10px 4px 2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.clp{display:flex;align-items:center;justify-content:center;width:100%;height:26px;color:var(--label3)}
.clp span{width:44px;height:18px;border-radius:9px;background:var(--fill2);display:flex;align-items:center;justify-content:center}
.clp svg{width:14px;height:14px;stroke-width:2.8}

/* Summaries */
.sum{border-top:.5px solid var(--sep);margin:12px 4px 4px;padding-top:14px}
.sum-h{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--fill2);border-radius:14px;padding:10px 12px;min-width:0}
.tv{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv.sm{font-size:18px;line-height:1.48}
.tl{font-size:12px;color:var(--label2);margin-top:2px}
.tv.g{color:var(--green)} .tv.r{color:var(--red)} .tv.o{color:var(--orange)}
.dl{font-size:11px;font-weight:600;color:var(--label3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.gd{color:var(--green)} .dl.bd{color:var(--orange)}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(64px,auto) 1fr 26px;align-items:center;gap:10px;font-size:14px}
.bl{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.bt{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.bf{height:100%;border-radius:4px}
.bn{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label2)}

/* Section switch + day lists */
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px;gap:3px;margin:20px 0 0}
.switch button{height:38px;border-radius:9px;font-size:15px;font-weight:600;color:var(--label2);text-align:center}
.switch button.on{background:var(--segon);color:var(--label);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 4px 10px}
.sec-eye{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.sec-eye.today{color:var(--accent)}
.sec-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.txt{color:var(--accent);font-size:17px;padding:6px 2px}
.txt.b{font-weight:600}
.prog{display:flex;align-items:center;gap:12px;margin:0 4px 14px}
.pt{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:flex}
.pt b{display:block;height:100%}
.pn{font-size:14px;color:var(--label2);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.hrow{padding:14px 14px 14px 16px}
.htop{display:flex;align-items:center;gap:12px}
.hn{flex:1;min-width:0}
button.hn{display:block;text-align:left}
.hl{display:flex;align-items:center;gap:4px}
.hl .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hl svg{width:13px;height:13px;flex:none;color:var(--label3);stroke-width:2.8}
.pick{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--label3);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.gbtn .pick svg{width:13px;height:13px;opacity:0;stroke-width:3.2}
.pick.on{background:var(--accent);border-color:var(--accent)}
.gbtn .pick.on svg{opacity:1}
.mdots{display:flex;gap:3px;flex:none}
.mdots i{width:9px;height:9px;border-radius:50%}
.lhead{text-align:center;padding:4px 16px 2px}

/* ---------- data ---------- */
function opt(label,i,goal){return {id:uid(),label:label,goal:!!goal,c:COLORS[i%COLORS.length]}}
function emptyProfile(){return {name:'',photo:'',age:'',height:'',gender:'',bio:'',u:0}}
function mkHabit(name,type,options,o){return {id:uid(),name:name,type:type,options:options||[],created:today(),days:ALLDAYS.slice(),pauses:[],archived:null,o:o,u:1,c:COLORS[o%COLORS.length],note:'',hist:[{d:today(),t:'Created'}]}}
function mkWorkout(name,c,o){return {id:uid(),name:name,c:c,created:today(),archived:null,o:o,u:1}}
function seedWorkouts(){return [mkWorkout('Push day','#ff9500',0),mkWorkout('Pull day','#007aff',1),mkWorkout('Leg day','#af52de',2),mkWorkout('Running','#34c759',3)]}
function seed(){
  return {v:3,pristine:true,profile:emptyProfile(),
    habits:[
      mkHabit('Wake up at 8:00','single',[opt('8:00',0,true),opt('8:15',1),opt('8:30',2),opt('8:45',3),opt('9:00+',4)],0),
      mkHabit('No smoking','check',[],1),
      mkHabit('Learning','multi',[opt('Reading',6),opt('Podcast',4),opt('Course',5)],2)
    ],workouts:seedWorkouts(),log:{},lt:{},wlog:{},wt:{},del:{},restC:'#8e8e93',restU:0};
}
function valid(d){return isObj(d)&&Array.isArray(d.habits)&&isObj(d.log)}
function sortItems(d){d.habits.sort(function(a,b){return a.o-b.o});d.workouts.sort(function(a,b){return a.o-b.o})}
function norm(d){
  var old=!(d.v>=2);
  d.profile=Object.assign(emptyProfile(),isObj(d.profile)?d.profile:{});
  if(typeof d.profile.u!=='number'||!d.profile.u)d.profile.u=(d.profile.name||d.profile.photo||d.profile.bio)?1:0;
  d.habits=d.habits.filter(function(h){return h&&h.id&&h.name&&['check','single','multi'].indexOf(h.type)>-1});
  d.habits.forEach(function(h,i){
    h.options=Array.isArray(h.options)?h.options.filter(function(o){return o&&o.id}):[];
    h.options.forEach(function(o,j){if(!o.c)o.c=COLORS[j%COLORS.length];o.goal=!!o.goal;o.label=String(o.label||'')});
    if(!h.c)h.c=COLORS[i%COLORS.length];
    if(typeof h.note!=='string')h.note='';
    if(!Array.isArray(h.hist))h.hist=[];
    h.hidden=h.hidden===true;
    if(!h.bg)h.bg=null;
    if(!h.created)h.created=today();
    if(!Array.isArray(h.days)||!h.days.length)h.days=ALLDAYS.slice();
    if(!Array.isArray(h.pauses))h.pauses=[];
    if(!h.archived)h.archived=null;
    if(typeof h.o!=='number')h.o=i;
    if(typeof h.u!=='number')h.u=1;
    delete h.emoji;delete h.color;
  });
  if(!Array.isArray(d.workouts))d.workouts=old?seedWorkouts():[];
  d.workouts=d.workouts.filter(function(w){return w&&w.id&&w.name});
  d.workouts.forEach(function(w,i){
    if(!w.c)w.c=COLORS[i%COLORS.length];if(!w.created)w.created=today();
    if(!w.archived)w.archived=null;if(typeof w.o!=='number')w.o=i;if(typeof w.u!=='number')w.u=1;
  });
  Object.keys(d.log).forEach(function(k){if(!isObj(d.log[k])||!Object.keys(d.log[k]).length)delete d.log[k]});
  if(!isObj(d.wlog))d.wlog={};
  Object.keys(d.wlog).forEach(function(k){if(!Array.isArray(d.wlog[k])||!d.wlog[k].length)delete d.wlog[k]});
  if(!isObj(d.lt)){d.lt={};Object.keys(d.log).forEach(function(ds){Object.keys(d.log[ds]).forEach(function(hid){d.lt[ds+'|'+hid]=1})})}
  if(!isObj(d.wt)){d.wt={};Object.keys(d.wlog).forEach(function(ds){d.wt[ds]=1})}
  if(!isObj(d.del))d.del={};
  if(!d.restC)d.restC='#8e8e93';
  if(typeof d.restU!=='number')d.restU=0;
  d.pristine=d.pristine===true;
  sortItems(d);
  d.v=3;
  return d;
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){
    try{var d=JSON.parse(raw);if(valid(d)){d=norm(d);try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}return d}}catch(e){}
    try{localStorage.setItem(KEY+'_unreadable_'+Date.now(),raw)}catch(e){}
  }
  var s=seed();
  try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}
  return s;
}
var S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){toast('Couldn’t save — storage is full');return false}
}
/* every change the user makes goes through touch(): saves and queues a cloud sync */
function touch(){S.pristine=false;var ok=save();scheduleSync();return ok}

/* merge two copies of the data (this phone + cloud). Newest change wins per item / per day. */
function mergeItems(xa,xb,del){
  var m={};
  xa.concat(xb).forEach(function(x){var c=m[x.id];if(!c||x.u>c.u)m[x.id]=x});
  return Object.keys(m).map(function(k){return clone(m[k])}).filter(function(x){return !(del[x.id]>=x.u)});
}
function merge(a,b){
  var out={v:3,pristine:false,profile:clone((b.profile.u>a.profile.u?b:a).profile),log:{},lt:{},wlog:{},wt:{},del:{}};
  [a.del,b.del].forEach(function(m){Object.keys(m).forEach(function(k){if(!(out.del[k]>=m[k]))out.del[k]=m[k]})});
  out.habits=mergeItems(a.habits,b.habits,out.del);
  out.workouts=mergeItems(a.workouts,b.workouts,out.del);
  var rs=(b.restU||0)>(a.restU||0)?b:a;out.restC=rs.restC||'#8e8e93';out.restU=Math.max(a.restU||0,b.restU||0);
  var hids={};out.habits.forEach(function(h){hids[h.id]=1});
  var keys={};Object.keys(a.lt).concat(Object.keys(b.lt)).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(k){
    var ta=a.lt[k]||0,tb=b.lt[k]||0,src=tb>ta?b:a,i=k.indexOf('|'),ds=k.slice(0,i),hid=k.slice(i+1);
    if(!hids[hid])return;
    out.lt[k]=Math.max(ta,tb);
    var e=src.log[ds],v=e?e[hid]:undefined;
    if(v!==undefined){if(!out.log[ds])out.log[ds]={};out.log[ds][hid]=clone(v)}
  });
  var wk={};Object.keys(a.wt).concat(Object.keys(b.wt)).forEach(function(k){wk[k]=1});
  Object.keys(wk).forEach(function(ds){
    var ta=a.wt[ds]||0,tb=b.wt[ds]||0,src=tb>ta?b:a;
    out.wt[ds]=Math.max(ta,tb);
    var arr=src.wlog[ds];if(arr&&arr.length)out.wlog[ds]=arr.slice();
  });
  sortItems(out);
  return out;
}

/* ---------- habits ---------- */
function H(id){for(var i=0;i<S.habits.length;i++)if(S.habits[i].id===id)return S.habits[i];return null}
function optOf(h,id){for(var i=0;i<h.options.length;i++)if(h.options[i].id===id)return h.options[i];return null}
function hasGoal(h){return h.options.some(function(o){return o.goal})}
function val(ds,h){var e=S.log[ds];return e?e[h.id]:undefined}
function setLog(ds,h,v){
  if(v===undefined){if(S.log[ds]){delete S.log[ds][h.id];if(!Object.keys(S.log[ds]).length)delete S.log[ds]}}
  else{if(!S.log[ds])S.log[ds]={};S.log[ds][h.id]=v}
  S.lt[ds+'|'+h.id]=Date.now();
  touch();
}
/* 'done' | 'miss' | null (not logged) */
function status(h,v){
  if(v===undefined||v===null)return null;
  if(h.type==='check')return v===true?'done':v===false?'miss':null;
  if(h.type==='single'){var o=optOf(h,v);if(!o)return null;return(!hasGoal(h)||o.goal)?'done':'miss'}
  if(Array.isArray(v)){
    var n=v.filter(function(id){return optOf(h,id)}).length;
    if(n)return 'done';
    return v.length===0?'miss':null;
  }
  return null;
}
function logged(h,ds){return status(h,val(ds,h))!==null}
function activePause(h){for(var i=0;i<h.pauses.length;i++)if(!h.pauses[i].to)return h.pauses[i];return null}
function applies(h,ds){
  if(h.hidden)return false;
  if(ds<h.created)return false;
  if(h.archived&&ds>=h.archived)return false;
  if(h.days.indexOf(dow(ds))<0)return false;
  for(var i=0;i<h.pauses.length;i++){var p=h.pauses[i];if(ds>=p.from&&(!p.to||ds<=p.to))return false}
  return true;
}
function activeHabits(){return S.habits.filter(function(h){return !h.archived})}
function shownHabits(){return S.habits.filter(function(h){return !h.archived&&!h.hidden})}
function tintStyle(h){return h.bg?' style="background:color-mix(in srgb,'+h.bg+' var(--tintp),var(--card))"':''}
function streak(h){
  var ds=today(),st=status(h,val(ds,h));
  if(st==='miss')return 0;
  if(st!=='done')ds=addDays(ds,-1);
  var n=0;
  for(var i=0;i<3660;i++){
    st=status(h,val(ds,h));
    if(st==='done'){n++;ds=addDays(ds,-1)}
    else if(!st&&!applies(h,ds)&&ds>=h.created){ds=addDays(ds,-1)}
    else break;
  }
  return n;
}
/* ---------- workouts ---------- */
function W(id){for(var i=0;i<S.workouts.length;i++)if(S.workouts[i].id===id)return S.workouts[i];return null}
function wraw(ds){return S.wlog[ds]||[]}
function wdone(ds){return wraw(ds).map(W).filter(Boolean).sort(function(a,b){return a.o-b.o})}
function isRest(ds){return wraw(ds).indexOf(REST)>-1}
function restItem(){return {id:REST,name:'Rest day',c:S.restC||'#8e8e93'}}
function wLogged(ds){return wraw(ds).some(function(x){return x===REST||W(x)})}
function wReq(ds){return S.workouts.some(function(w){return w.created<=ds&&(!w.archived||ds<w.archived)})}
function setW(ds,arr){if(arr.length)S.wlog[ds]=arr;else delete S.wlog[ds];S.wt[ds]=Date.now();touch()}
function activeWorkouts(){return S.workouts.filter(function(w){return !w.archived})}
function lastDone(w){
  var ds=today();
  for(var i=0;i<730;i++){if(wraw(ds).indexOf(w.id)>-1)return i;ds=addDays(ds,-1)}
  return -1;
}
function weekCount(w){
  var ds=today(),n=0,k=dow(ds);
  for(var i=0;i<=k;i++){if(wraw(ds).indexOf(w.id)>-1)n++;ds=addDays(ds,-1)}
  return n;
}

/* ---------- day completeness: Done = everything registered (habits + a workout or rest day) ---------- */
function dayReg(ds){
  var need=0,have=0;
  for(var i=0;i<S.habits.length;i++){var h=S.habits[i],l=logged(h,ds);if(l||applies(h,ds)){need++;if(l)have++}}
  var wl=wLogged(ds);
  if(wl||wReq(ds)){need++;if(wl)have++}
  return {need:need,have:have};
}
function isDone(r){return r.need>0&&r.have===r.need}
function monthStats(y,m,lim){
  var n=new Date(y,m+1,0).getDate(),t=today(),s={done:0,inc:0,wd:0,ses:0,rest:0,tracked:0,per:{}};
  lim=Math.min(lim||n,n);
  for(var i=1;i<=lim;i++){
    var ds=ymd(new Date(y,m,i));if(ds>t)break;
    var r=dayReg(ds);
    if(r.need){s.tracked++;if(isDone(r))s.done++;else if(ds<t)s.inc++}
    var dn=wdone(ds);
    if(dn.length){s.wd++;s.ses+=dn.length;dn.forEach(function(w){s.per[w.id]=(s.per[w.id]||0)+1})}
    else if(isRest(ds)){s.rest++;s.per[REST]=(s.per[REST]||0)+1}
  }
  return s;
}
/* this month vs. the same days of last month */
function compareMonth(y,m){
  var n=new Date(),cur=y===n.getFullYear()&&m===n.getMonth(),lim=cur?n.getDate():31;
  var a=monthStats(y,m,lim),pd=new Date(y,m-1,1),b=monthStats(pd.getFullYear(),pd.getMonth(),lim);
  return {a:a,b:(b.tracked||b.wd||b.rest)?b:null,pm:monthShort(pd)};
}
function earliest(){
  var e=null;
  S.habits.concat(S.workouts).forEach(function(x){if(!e||x.created<e)e=x.created});
  Object.keys(S.log).concat(Object.keys(S.wlog)).forEach(function(k){if(!e||k<e)e=k});
  return e;
}
function doneStreaks(){
  var start=earliest(),t=today(),run=0,best=0;
  if(!start)return {cur:0,best:0};
  for(var ds=start,i=0;ds<=t&&i<4000;ds=addDays(ds,1),i++){
    var r=dayReg(ds);if(!r.need)continue;
    if(isDone(r)){run++;if(run>best)best=run}
    else if(ds<t)run=0;
  }
  return {cur:run,best:best};
}

function dayCell(date,v){
  var ds=ymd(date),t=today(),fut=ds>t,c={cls:'',ring:'',under:'',style:''};
  if(!fut){
    if(v.k==='all'){
      var r=dayReg(ds);
      if(r.need){
        if(isDone(r))c.cls='full-g';
        else if(ds===t){var a=r.have/r.need*100;c.ring='<span class="ring" style="background:conic-gradient(var(--green) 0 '+a+'%,var(--track) '+a+'% 100%)"></span>'}
        else c.cls='tint-o';
      }
    }else if(v.k==='wall'){
      var dn=wdone(ds);
      if(dn.length)c.under=dn.slice(0,4).map(function(w){return '<span class="cd" style="background:'+w.c+'"></span>'}).join('');
      else if(isRest(ds))c.under='<span class="cd" style="background:'+restItem().c+'"></span>';
    }else if(v.k==='m'){
      var onI=v.items.filter(function(it){return it.on(ds)}),relI=v.items.filter(function(it){return it.on(ds)||it.rel(ds)});
      if(onI.length){c.under=onI.slice(0,5).map(function(it){return '<span class="cd" style="background:'+it.c+'"></span>'}).join('');if(onI.length===relI.length)c.cls='tint-g'}
    }else if(v.k==='w'){
      if(wraw(ds).indexOf(v.x.id)>-1){c.cls='full-c';c.style='background:'+v.x.c}
    }else{
      var h=v.x,val0=val(ds,h),st=status(h,val0);
      if(h.type==='check'){if(st==='done')c.cls='full-g';else if(st==='miss')c.cls='full-r'}
      else if(h.type==='single'){
        if(st){var o=optOf(h,val0);c.cls=st==='done'?'tint-g':'tint-o';c.under='<span class="ul '+(st==='done'?'g':'o')+'">'+esc(o.label)+'</span>'}
      }else if(Array.isArray(val0)){
        if(st==='miss')c.cls='tint-r';
        else if(st==='done')c.under=val0.map(function(id){return optOf(h,id)}).filter(Boolean).slice(0,4).map(function(o){return '<span class="cd" style="background:'+o.c+'"></span>'}).join('');
      }
    }
  }
  return '<button class="day'+(ds===ui.sel?' sel':'')+(ds===t?' today':'')+(fut?' fut':'')+'" data-a="day" data-d="'+ds+'"'+(fut?' disabled':'')+'>'+
    '<span class="num '+c.cls+'"'+(c.style?' style="'+c.style+'"':'')+'>'+c.ring+date.getDate()+'</span><span class="under">'+c.under+'</span></button>';
}
function li(c,l){return '<span><i style="background:'+c+'"></i>'+l+'</span>'}
function legend(v){
  if(v.k==='all')return '<div class="legend">'+li('var(--green)','Done')+li('var(--orange)','Incomplete')+'</div>';
  if(v.k==='m')return '<div class="legend">'+v.items.map(function(it){return li(it.c,esc(it.name))}).join('')+'</div>';
  if(v.k==='w')return '<div class="legend">'+li(v.x.c,esc(v.x.name)+' done')+'</div>';
  if(v.k==='wall'){
    var ws=monthWorkouts();
    return ws.length?'<div class="legend">'+ws.map(function(w){return li(w.c,esc(w.name))}).join('')+'</div>':'';
  }
  var h=v.x;
  if(h.type==='check')return '<div class="legend">'+li('var(--green)','Done')+li('var(--red)','Missed')+'</div>';
  if(h.type==='single')return hasGoal(h)?'<div class="legend">'+li('var(--green)','On goal')+li('var(--orange)','Other answer')+'</div>':'';
  return '<div class="legend">'+h.options.map(function(o){return li(o.c,esc(o.label))}).join('')+li('var(--red)','None')+'</div>';
}
/* active workouts + archived ones that were done this month */
function monthWorkouts(){
  var st=monthStats(ui.month.getFullYear(),ui.month.getMonth());
  return S.workouts.filter(function(w){return !w.archived||st.per[w.id]}).concat([restItem()]);
}
function tile(v,l,c,extra){return '<div class="tile"><div class="tv '+(c||'')+'">'+v+'</div><div class="tl">'+l+'</div>'+(extra||'')+'</div>'}
function delta(cur,prev,better,pm){
  if(prev==null)return '';
  var d=cur-prev;
  if(!d)return '<div class="dl">Same as '+esc(pm)+'</div>';
  var good=better==='up'?d>0:better==='down'?d<0:null;
  return '<div class="dl'+(good===null?'':good?' gd':' bd')+'">'+(d>0?'↑':'↓')+Math.abs(d)+' vs '+esc(pm)+'</div>';
}
function bars(rows){
  var max=Math.max.apply(null,rows.map(function(r){return r.n}).concat([1]));
  return '<div class="bars">'+rows.map(function(r){
    return '<div class="bar"><div class="bl">'+r.l+'</div><div class="bt"><div class="bf" style="width:'+(r.n/max*100)+'%;background:'+r.c+'"></div></div><div class="bn">'+r.n+'</div></div>';
  }).join('')+'</div>';
}
function overviewTiles(y,m){
  var c=compareMonth(y,m),a=c.a,b=c.b;
  return '<div class="tiles">'+tile(a.done,'Done days','g',delta(a.done,b&&b.done,'up',c.pm))+
    tile(a.inc,'Incomplete','o',delta(a.inc,b&&b.inc,'down',c.pm))+
    tile(a.wd,'Workout days','',delta(a.wd,b&&b.wd,'up',c.pm))+'</div>';
}
function summary(v){
  var y=ui.month.getFullYear(),m=ui.month.getMonth(),mn=esc(monthName(ui.month));
  var t=today(),first=ymd(new Date(y,m,1));
  if(first>t)return '<div class="sum"><div class="sum-h">'+mn+'</div><div class="tl">Nothing to show yet.</div></div>';
  if(v.k==='all')return '<div class="sum"><div class="sum-h">'+mn+' overview</div>'+overviewTiles(y,m)+'</div>';
  if(v.k==='m'){
    var mc=v.items.map(function(){return 0}),alld=0,part=0,dim=new Date(y,m+1,0).getDate();
    for(var q=1;q<=dim;q++){
      var dq=ymd(new Date(y,m,q));if(dq>t)break;
      var rel=0,onn=0;
      v.items.forEach(function(it,k){var o=it.on(dq);if(o)mc[k]++;if(o||it.rel(dq)){rel++;if(o)onn++}});
      if(rel){if(onn===rel)alld++;else if(dq<t)part++}
    }
    return '<div class="sum"><div class="sum-h">Selected in '+mn+'</div><div class="tiles">'+tile(alld,'All done','g')+tile(part,'Not all','o')+tile(v.items.length,'Selected')+'</div>'+
      bars(v.items.map(function(it,k){return {l:'<span class="cd" style="background:'+it.c+'"></span>'+esc(it.name),n:mc[k],c:it.c}}))+'</div>';
  }
  if(v.k==='wall'){
    var c=compareMonth(y,m),a=c.a,b=c.b,full=monthStats(y,m);
    return '<div class="sum"><div class="sum-h">Workouts in '+mn+'</div><div class="tiles">'+
      tile(a.wd,'Workout days','g',delta(a.wd,b&&b.wd,'up',c.pm))+tile(a.ses,'Sessions','',delta(a.ses,b&&b.ses,'up',c.pm))+
      tile(a.rest,'Rest days','',delta(a.rest,b&&b.rest,null,c.pm))+'</div>'+
      bars(monthWorkouts().map(function(w){return {l:'<span class="cd" style="background:'+w.c+'"></span>'+esc(w.name),n:full.per[w.id]||0,c:w.c}}))+'</div>';
  }
  var days=[],n=new Date(y,m+1,0).getDate();
  for(var i=1;i<=n;i++){var ds=ymd(new Date(y,m,i));if(ds<=t)days.push(ds)}
  if(v.k==='w'){
    var w=v.x,cm=compareMonth(y,m),times=cm.a.per[w.id]||0,pt=cm.b?(cm.b.per[w.id]||0):null;
    var ld=lastDone(w),lt=ld<0?'–':ld===0?'Today':ld===1?'Yesterday':ld+' days';
    return '<div class="sum"><div class="sum-h">'+esc(w.name)+' in '+mn+'</div><div class="tiles">'+tile(times,'Times','',delta(times,pt,'up',cm.pm))+tile(weekCount(w),'This week')+
      '<div class="tile"><div class="tv sm">'+lt+'</div><div class="tl">'+(ld>1?'Since last time':'Last time')+'</div></div></div></div>';
  }
  var h=v.x,cnt={},done=0,miss=0;
  days.forEach(function(ds){
    var vv=val(ds,h),st=status(h,vv);
    if(st==='done')done++;else if(st==='miss')miss++;
    if(h.type==='single'&&st)cnt[vv]=(cnt[vv]||0)+1;
    if(h.type==='multi'&&Array.isArray(vv))vv.forEach(function(id){cnt[id]=(cnt[id]||0)+1});
  });
  var sk=streak(h),head='<div class="sum"><div class="sum-h">'+esc(h.name)+' in '+mn+'</div>';
  if(h.type==='check')return head+'<div class="tiles">'+tile(done,'Done','g')+tile(miss,'Missed','r')+tile(sk,'Day streak')+'</div></div>';
  if(h.type==='single'){
    var g=hasGoal(h);
    var tt=g?tile(done,'On goal','g')+tile(miss,'Other answer','o'):tile(done,'Days logged')+tile('–','No goal set');
    return head+'<div class="tiles">'+tt+tile(sk,'Day streak')+'</div>'+
      bars(h.options.map(function(o){return {l:(o.goal&&g?'<span style="color:var(--orange);font-size:11px">★</span>':'')+esc(o.label),n:cnt[o.id]||0,c:(!g||o.goal)?'var(--green)':'var(--orange)'}}))+'</div>';
  }
  return head+'<div class="tiles">'+tile(done,'Active days','g')+tile(miss,'None','r')+tile(sk,'Day streak')+'</div>'+
    bars(h.options.map(function(o){return {l:'<span class="cd" style="background:'+o.c+'"></span>'+esc(o.label),n:cnt[o.id]||0,c:o.c}}))+'</div>';
}
function dayHead(showEdit){
  var ds=ui.sel,d=parseD(ds),isT=ds===today();
  return '<div class="sec-head"><div><div class="sec-eye'+(isT?' today':'')+'">'+(isT?'Today':esc(weekday(d)))+'</div>'+
    '<div class="sec-title">'+esc(d.getDate()+' '+monthName(d)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''))+'</div></div>'+
    (showEdit?'<button class="txt" data-a="edit-toggle">'+(ui.edit?'Done':'Edit')+'</button>':'')+'</div>';
}
var TYPE_LABEL={check:'Done / Missed',single:'Single choice',multi:'Multiple choice'};
function editBtns(kind,id,i,len){
  return '<div class="ebtns"><button data-a="'+kind+'-up" data-id="'+id+'"'+(i===0?' disabled':'')+' aria-label="Move up">'+I.up+'</button>'+
    '<button data-a="'+kind+'-down" data-id="'+id+'"'+(i===len-1?' disabled':'')+' aria-label="Move down">'+I.down+'</button>'+
    '<button class="p" data-a="'+kind+'-edit" data-id="'+id+'" aria-label="Edit">'+I.pencil+'</button></div>';

function renderHabitsDay(){

      '<button class="add" data-a="habit-new">'+I.plus+'New habit</button>';
  }
  if(ui.edit){
    return head+'<div class="list">'+act.map(function(h,i){
      var p=activePause(h);
      return '<div class="card hrow'+(h.hidden?' hid':'')+'"'+tintStyle(h)+'><div class="htop"><div class="hn"><div class="hname">'+esc(h.name)+'</div><div class="hsub">'+
        (h.hidden?'Hidden':p?'Paused':TYPE_LABEL[h.type])+'</div></div>'+
        '<div class="ebtns"><button class="p" data-a="h-eye" data-id="'+h.id+'" aria-label="'+(h.hidden?'Show habit':'Hide habit')+'">'+(h.hidden?I.eyeOff:I.eye)+'</button></div>'+
        editBtns('h',h.id,i,act.length)+'</div></div>';
    }).join('')+'</div><button class="add" data-a="habit-new">'+I.plus+'New habit</button>';
  }
  var list=S.habits.filter(function(h){return !h.hidden&&(applies(h,ds)||logged(h,ds))});
  var done=0,miss=0;list.forEach(function(h){var st=status(h,val(ds,h));if(st==='done')done++;else if(st==='miss')miss++});
  var n=list.length,a=n?done/n*100:0,b=n?miss/n*100:0;
  var html=head;
  if(n){
    html+='<div class="prog"><div class="pt"><b style="width:'+a+'%;background:var(--green)"></b><b style="width:'+b+'%;background:var(--red)"></b></div>'+
      '<div class="pn">'+(done+miss)+' of '+n+' filled in</div></div>'+
      '<div class="list">'+list.map(function(h){return habitRow(h,ds)}).join('')+'</div>';
  }else html+='<div class="card empty"><b>Nothing scheduled</b>No habits apply to this day.</div>';
  var off=act.filter(function(h){return !h.hidden&&list.indexOf(h)<0&&!activePause(h)&&ds>=h.created});
  if(off.length)html+='<div class="note">Not scheduled this day: '+off.map(function(h){return esc(h.name)}).join(', ')+'</div>';
  var paused=act.filter(function(h){return !h.hidden&&activePause(h)});
  if(paused.length){
    html+='<div class="minihead">Paused</div><div class="card">'+paused.map(function(h){
      return '<div class="prow"><div class="hn"><div class="hname">'+esc(h.name)+'</div><div class="hsub">Paused since '+esc(niceDate(activePause(h).from))+'</div></div>'+
        '<button class="sbtn" data-a="h-resume" data-id="'+h.id+'">Resume</button></div>';
    }).join('')+'</div>';
  }
  var nh=act.filter(function(h){return h.hidden}).length;
  html+='<button class="add" data-a="habit-new">'+I.plus+'New habit</button>';
  if(nh)html+='<button class="hidnote" data-a="edit-toggle">'+I.eyeOff+nh+' hidden habit'+(nh===1?'':'s')+' · tap to manage</button>';
  return html;
}
function daysText(days){
  if(days.length===7)return 'Every day';
  var s=days.slice().sort().join('');
  if(s==='01234')return 'Weekdays';
  if(s==='56')return 'Weekends';
  return days.slice().sort().map(function(i){return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}).join(', ');
}
function habitRow(h,ds){
  var v=val(ds,h),st=status(h,v),sub,sc='';
  if(!st)sub='Not filled in';
  else if(h.type==='check'){sub=st==='done'?'Done':'Missed';sc=st==='done'?'g':'r'}
  else if(h.type==='single'){var o=optOf(h,v);sub=esc(o.label)+(hasGoal(h)?(st==='done'?' · On goal':' · Not on goal'):'');sc=st==='done'?'g':'o'}
  else{
    var ls=v.map(function(id){var o=optOf(h,id);return o?esc(o.label):null}).filter(Boolean);
    sub=ls.length?ls.join(', '):'None';sc=ls.length?'g':'r';
  }
  var on=ui.view==='h:'+h.id;
  return '<div class="card hrow"'+tintStyle(h)+'><div class="htop">'+
    '<button class="hn" data-a="h-log" data-id="'+h.id+'"><div class="hname hl"><span class="tx">'+esc(h.name)+'</span>'+I.chevR+'</div><div class="hsub '+sc+'">'+sub+'</div></button>'+
    (h.archived?'':'<button class="fbtn'+(on?' on':'')+'" data-a="focus" data-v="h:'+h.id+'" aria-label="Show in calendar">'+I.cal+'</button>')+
    '</div><div class="hctl">'+controls(h,v)+'</div></div>';
}
function controls(h,v,ds){
  var id=' data-h="'+h.id+'"'+(ds?' data-d="'+ds+'"':'');
  if(h.type==='check'){
    return '<div class="chips"><button class="chip'+(v===true?' on-g':'')+'" data-a="log-check"'+id+' data-v="1">Done</button>'+
      '<button class="chip'+(v===false?' on-r':'')+'" data-a="log-check"'+id+' data-v="0">Missed</button></div>';
  }
  var g=hasGoal(h);
  if(h.type==='single'){
    return '<div class="chips">'+h.options.map(function(o){
      var on=v===o.id,c=on?((!g||o.goal)?' on-g':' on-o'):'';
      return '<button class="chip'+c+'" data-a="log-single"'+id+' data-o="'+o.id+'">'+(o.goal&&g?'<span class="star">★</span>':'')+esc(o.label)+'</button>';
    }).join('')+'</div>';
  }
  var arr=Array.isArray(v)?v:[];
  return '<div class="chips">'+h.options.map(function(o){
    var on=arr.indexOf(o.id)>-1;
    return '<button class="chip'+(on?' on-c':'')+'"'+(on?' style="background:'+o.c+'"':'')+' data-a="log-multi"'+id+' data-o="'+o.id+'"><span class="dot" style="background:'+o.c+'"></span>'+esc(o.label)+'</button>';
  }).join('')+'<button class="chip ghost'+(Array.isArray(v)&&v.length===0?' on-r':'')+'" data-a="log-none"'+id+'>None</button></div>';
}

  z.addEventListener('touchmove',function(e){if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform='translateY('+dy+'px)'},{passive:true});
  z.addEventListener('touchend',function(){if(y0===null)return;y0=null;sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet()});

function setWheel(w,i,smooth){
  if(smooth&&w.scrollTo)w.scrollTo({top:i*40,behavior:'smooth'});else w.scrollTop=i*40;
  paintWheel(w);
}
function wheelIndex(w){var n=$$('.wi',w).length;return Math.max(0,Math.min(n-1,Math.round(w.scrollTop/40)))}
function paintWheel(w){
  var st=w.scrollTop,sel=wheelIndex(w);
  $$('.wi',w).forEach(function(el,i){
    var d=(i*40-st)/40,ad=Math.min(Math.abs(d),4);
    el.style.transform='rotateX('+(-d*17)+'deg)';
    el.style.opacity=String(Math.max(.28,1-ad*.2));
    el.classList.toggle('on',i===sel);
  });
}

function habitChanges(a,b){
  var out=[];
  if(a.name!==b.name)out.push('Renamed from “'+a.name+'”');
  var la=a.options.map(function(o){return o.label}).join('|'),lb=b.options.map(function(o){return o.label}).join('|');
  if(la!==lb)out.push('Answers changed');
  var ga=a.options.filter(function(o){return o.goal}).map(function(o){return o.label}).join(', '),gb=b.options.filter(function(o){return o.goal}).map(function(o){return o.label}).join(', ');
  if(b.type==='single'&&ga!==gb)out.push(gb?'Goal set to '+gb:'Goal removed');
  if(a.days.slice().sort().join()!==b.days.slice().sort().join())out.push('Repeat days: '+daysText(b.days));
  return out;
}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
function answerText(h,v){
  var st=status(h,v);if(!st)return {t:'–',c:''};
  if(h.type==='check')return {t:st==='done'?'Done':'Missed',c:st==='done'?'g':'r'};
  if(h.type==='single'){var o=optOf(h,v);return {t:o.label,c:st==='done'?'g':'o'}}
  var ls=v.map(function(id){var o=optOf(h,id);return o?o.label:null}).filter(Boolean);
  return {t:ls.length?ls.join(', '):'None',c:ls.length?'g':'r'};
}
function habitStats(h){
  var t=today(),s={done:0,miss:0,none:0,cnt:{},best:0},run=0;
  var first=h.created;
  Object.keys(S.log).forEach(function(ds){if(ds<first&&S.log[ds][h.id]!==undefined)first=ds});
  for(var ds=first,i=0;ds<=t&&i<6000;ds=addDays(ds,1),i++){
    var v=val(ds,h),st=status(h,v);
    if(st==='done'){s.done++;run++;if(run>s.best)s.best=run}
    else if(st==='miss'){s.miss++;run=0}
    else if(applies(h,ds)){if(ds<t){s.none++;run=0}}
    if(h.type==='single'&&st)s.cnt[v]=(s.cnt[v]||0)+1;
    if(h.type==='multi'&&Array.isArray(v))v.forEach(function(x){if(optOf(h,x))s.cnt[x]=(s.cnt[x]||0)+1});
  }
  var tot=s.done+s.miss+s.none;s.rate=tot?Math.round(s.done/tot*100)+'%':'–';
  var top=null;Object.keys(s.cnt).forEach(function(k){if(!top||s.cnt[k]>s.cnt[top])top=k});
  s.top=top?optOf(h,top).label+' ('+s.cnt[top]+'×)':null;
  return s;
}

function logBody(){
  var h=H(logH);if(!h)return '<div class="empty"><b>Habit not found</b></div>';
  var t=today(),s=habitStats(h),run=daysBetween(h.created,t)+1,p=activePause(h);
  var missLabel=h.type==='single'&&hasGoal(h)?'Other answer':h.type==='multi'?'None':'Missed';
  var html='<div class="lhead"><div class="lname">'+esc(h.name)+'</div><div class="lsub">'+TYPE_LABEL[h.type]+' · '+daysText(h.days)+(p?' · Paused':'')+(h.hidden?' · Hidden':'')+(h.archived?' · Archived':'')+'</div></div>';
  html+='<div class="ltiles">'+tile(run<1?'–':run,run===1?'Day running':'Days running')+tile(s.rate,'Success rate','g')+tile(streak(h),'Current streak')+
    tile(s.done,h.type==='single'&&hasGoal(h)?'On goal':'Done','g')+tile(s.miss,missLabel,h.type==='single'?'o':'r')+tile(s.none,'Not filled in')+'</div>';
  html+='<div class="glabel">Details</div><div class="group">'+
    '<div class="grow"><label>Started</label><input type="date" data-f="l-start" value="'+h.created+'" max="'+t+'"></div>'+
    '<div class="grow"><label>Best streak</label><span class="rv">'+s.best+(s.best===1?' day':' days')+'</span></div>'+
    (s.top?'<div class="grow"><label>Most picked</label><span class="rv">'+esc(s.top)+'</span></div>':'')+
    '</div><div class="ghint">Change the start date to fill in days from before you created this habit.</div>';
  html+='<div class="glabel">Note</div><div class="group"><div class="grow"><textarea data-f="l-note" rows="2" maxlength="300" placeholder="Why you started, or what your goal is">'+esc(h.note)+'</textarea></div></div>';
  /* filled-in days */
  var days=Object.keys(S.log).filter(function(ds){return S.log[ds][h.id]!==undefined}).sort().reverse();
  var shown=days.slice(0,logLimit);
  if(logOpen&&shown.indexOf(logOpen)<0)shown.unshift(logOpen);
  html+='<div class="glabel">Filled-in days</div><div class="group">'+
    '<div class="grow"><label>Fill in a day</label><input type="date" data-f="l-day" value="" max="'+t+'"></div>'+
    shown.map(function(ds){
      var a=answerText(h,val(ds,h)),d=parseD(ds),open=logOpen===ds;
      return '<button class="grow lg-row" data-a="l-open" data-d="'+ds+'"><span class="lg-d">'+esc(d.toLocaleDateString('en-GB',{weekday:'short'})+' '+niceDate(ds))+'</span>'+
        '<span class="lg-v '+a.c+'">'+esc(a.t)+'</span><span class="rchev">'+(open?I.chevD:I.chevR)+'</span></button>'+
        (open?'<div class="lg-edit">'+controls(h,val(ds,h),ds)+'<button class="sbtn red" data-a="l-clear" data-d="'+ds+'">Clear this day</button></div>':'');
    }).join('')+
    (days.length>logLimit?'<button class="more grow" data-a="l-more">Show more</button>':'')+'</div>'+
    (days.length?'':'<div class="ghint">Nothing filled in yet.</div>');
  /* history */
  var hist=h.hist.map(function(e,i){return {d:e.d,t:e.t,i:i}}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.i-a.i});
  var hasCreated=h.hist.some(function(e){return e.t==='Created'});
  html+='<div class="glabel">History</div><div class="group">'+
    hist.map(function(e){return '<div class="grow lg-row"><span class="lg-d">'+esc(niceDate(e.d))+'</span><span class="lg-v" style="font-weight:500">'+esc(e.t)+'</span>'+
      '<button class="hx" data-a="l-hdel" data-i="'+e.i+'" aria-label="Remove">'+I.x+'</button></div>'}).join('')+
    (hasCreated?'':'<div class="grow lg-row"><span class="lg-d">'+esc(niceDate(h.created))+'</span><span class="lg-v" style="font-weight:500">Started</span></div>')+'</div>';
  return html;
}

/* ---------- cloud sync (Supabase) ---------- */
function loadSync(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}}
var SY=loadSync();
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(SY))}catch(e){}}
function signedIn(){return !!(SY.rt&&SY.url&&SY.key&&SY.uid)}
var syncing=false,again=false,syncTimer=0;
function scheduleSync(){if(!signedIn())return;clearTimeout(syncTimer);syncTimer=setTimeout(sync,1500)}
function authCall(path,body){
  return fetch(SY.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:SY.key,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var e=new Error(j.error_description||j.msg||j.message||('Error '+r.status));e.status=r.status;e.auth=true;throw e}
      return j;
    })});
}
function setTokens(j){SY.at=j.access_token;SY.rt=j.refresh_token;SY.exp=Date.now()+((j.expires_in||3600)*1000);if(j.user&&j.user.id)SY.uid=j.user.id;saveSync()}
function getToken(){
  if(SY.at&&Date.now()<SY.exp-60000)return Promise.resolve(SY.at);
  return authCall('token?grant_type=refresh_token',{refresh_token:SY.rt}).then(function(j){setTokens(j);return SY.at});
}
function api(method,qs,body,tok){
  return fetch(SY.url+'/rest/v1/'+TABLE+qs,{method:method,
    headers:{apikey:SY.key,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
    body:body?JSON.stringify(body):undefined}).then(function(r){
      if(!r.ok)return r.text().then(function(t){var m='Error '+r.status;try{var j=JSON.parse(t);m=j.message||j.hint||m}catch(x){}var e=new Error(m);e.status=r.status;throw e});
      return method==='GET'?r.json():null;
    });
}
function sync(){
  if(!signedIn())return Promise.resolve();
  if(syncing){again=true;return Promise.resolve()}
  syncing=true;paintSync();
  var tok;
  return getToken().then(function(t){tok=t;return api('GET','?select=data',null,tok)}).then(function(rows){
    var remote=rows&&rows[0]&&valid(rows[0].data)?norm(rows[0].data):null;
    var merged=!remote?S:(S.pristine?remote:merge(S,remote));
    var mj=JSON.stringify(merged);
    if(mj!==JSON.stringify(S)){S=merged;save();render()}
    if(!remote||mj!==JSON.stringify(remote))return api('POST','?on_conflict=user_id',{user_id:SY.uid,data:merged,updated_at:new Date().toISOString()},tok);
  }).then(function(){SY.last=Date.now();SY.err='';saveSync()})
  .catch(function(e){
    if(e&&e.auth&&e.status>=400&&e.status<500){SY.rt='';SY.at='';SY.err='Signed out — please sign in again'}
    else if(navigator.onLine===false||e instanceof TypeError)SY.err='Offline — will sync when online';
    else SY.err=(e&&e.message)||'Sync failed';
    saveSync();
  }).then(function(){syncing=false;paintSync();if(again){again=false;scheduleSync()}});
}
function paintSync(){if(ui.tab==='settings'&&!$('.ov'))render()}
var sdraft=null;

function exportData(){
  var name='dailyhub-backup-'+today()+'.json',json=JSON.stringify(S);
  var file;try{file=new File([json],name,{type:'application/json'})}catch(e){file=new Blob([json],{type:'application/json'})}
  if(navigator.canShare&&file instanceof File&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(function(e){if(e&&e.name!=='AbortError')download(file,name)});return;
  }
  download(file,name);
}
function download(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function moveIn(list,id,dir){
  var i=list.findIndex(function(x){return x.id===id}),j=i+dir;
  if(i<0||j<0||j>=list.length)return;
  var a=list[i],b=list[j],t=a.o,n=Date.now();a.o=b.o;b.o=t;if(a.o===b.o)a.o+=dir;a.u=b.u=n;
  sortItems(S);touch();render();
}
function nextO(list){return list.reduce(function(m,x){return Math.max(m,x.o)},-1)+1}
function pauseHabit(h){if(!activePause(h)){h.pauses.push({from:today(),to:null});h.hist.push({d:today(),t:'Paused'});h.u=Date.now()}}
function resumeHabit(h){
  var p=activePause(h);if(!p)return;
  p.to=addDays(today(),-1);
  if(p.to<p.from)h.pauses.splice(h.pauses.indexOf(p),1);
  h.hist.push({d:today(),t:'Resumed'});
  h.u=Date.now();
}
